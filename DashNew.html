<!DOCTYPE html>

  <title>SAFETY & 5S DASHBOARD</title>
  
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <script>
    const appColor = localStorage.getItem('appColor') || '#E65100'; // สีเริ่มต้น (ส้ม)
    const appFont = localStorage.getItem('appFont') || "'Prompt', sans-serif";
    
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: appColor },
          fontFamily: { sans: [appFont] }
        }
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      body { font-family: theme('fontFamily.sans'); }
      .hide-scroll::-webkit-scrollbar { display: none; }
      .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Responsive Table Styles (CSS Trick เดิมปรับให้เข้ากับ Tailwind) */
      @media (max-width: 768px) {
        .responsive-table thead { display: none; }
        .responsive-table tr { display: flex; flex-direction: column; margin-bottom: 1rem; border: 1px solid #e2e8f0; border-radius: 0.75rem; overflow: hidden; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .responsive-table td { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; text-align: right; }
        .responsive-table td::before { content: attr(data-label); font-weight: 600; color: theme('colors.slate.500'); font-size: 0.8rem; text-align: left; margin-right: 1rem; }
        .responsive-table td:last-child { border-bottom: none; }
      }
    }
    
    /* Loader Animation */
    .spin-ring { border-top-color: theme('colors.primary'); animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

    function getDriveThumbnailUrl(url) {
      if(!url) return "";
      let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if(match && match[1]) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w500`;
      return url;
    }

    function calculate5SScore(checklist, areaStr) {
      const areaData = CHECKLIST_5S[areaStr] || CHECKLIST_5S["OFFICE"];
      const sections = areaData?.sections || [];
      let total = 0, max = 0;
      sections.forEach((sec, sIdx) => {
        const questions = sec.questions || sec.qs || [];
        questions.forEach((_, qIdx) => {
          const val = checklist?.[`5s_s${sIdx}_q${qIdx}`];
          max += 2;
          if (val === "ดี") total += 2;
          else if (val === "พอใช้") total += 1;
        });
      });
      return max > 0 ? Math.round((total / max) * 100) : 0;
    }

    function loadData() {
      const loader = document.getElementById('loader'); loader.classList.remove('hidden'); loader.classList.add('flex');
      fetch(API_URL + "?action=getDashboardData")
      .then(r => r.json()).then(data => {
        rawData = data.details || [];
        rawData.forEach(d => {
          if (!d.inspectionType) d.inspectionType = "Safety";
          if (d.inspectionType.toUpperCase() === "5S" && d.fullChecklist) {
            d.hasBad = Object.values(d.fullChecklist).includes("ปรับปรุง") || Object.values(d.fullChecklist).includes("ไม่ดี");
          }
        });
        renderTable(); 
        loader.classList.add('hidden'); loader.classList.remove('flex');
      }).catch(err => { 
        loader.classList.add('hidden'); loader.classList.remove('flex'); 
        console.error("Error:", err); 
      });
    }

      document.querySelectorAll('.type-btn').forEach(b => {
        b.classList.remove('border-primary', 'bg-primary/10', 'text-primary', 'border-green-500', 'text-green-500', 'border-blue-500', 'text-blue-500');
        b.classList.add('border-slate-100', 'bg-slate-50', 'text-slate-500');
      }); 
      
      el.classList.remove('border-slate-100', 'bg-slate-50', 'text-slate-500');
      if(type === '5S') el.classList.add('border-green-500', 'bg-green-50', 'text-green-600');
      else if(type === 'Audit') el.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-600');
      else el.classList.add('border-primary', 'bg-primary/10', 'text-primary');
      
      renderTable(); 
    }

      }); 
      document.getElementById('card-' + status).classList.remove('border-b-slate-200');
      document.getElementById('card-' + status).classList.add('border-b-primary');
      renderTable();

    function renderTable() {
      let filtered = [...rawData];
      const dateVal = document.getElementById('dateFilter').value;
      if (dateVal) filtered = filtered.filter(d => d.timestamp?.startsWith(dateVal));
      if (currentType !== 'all') filtered = filtered.filter(d => d.inspectionType?.toUpperCase() === currentType.toUpperCase());
      
      const t = filtered.length, b = filtered.filter(d => d.hasBad).length, g = t - b;
      document.getElementById('countTotal').innerText = t; 
      document.getElementById('countGood').innerText = g; 
      document.getElementById('countBad').innerText = b;
      
      if (currentStatus === 'good') filtered = filtered.filter(d => !d.hasBad);
      if (currentStatus === 'bad') filtered = filtered.filter(d => d.hasBad);

      const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
      if(filtered.length === 0) { 
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-12 text-slate-400"><i class="fas fa-folder-open text-4xl opacity-30 mb-3 block"></i> <p class="font-semibold text-slate-600">ไม่พบข้อมูลตามเงื่อนไขที่เลือก</p></td></tr>`; 
        return; 
      }

      filtered.forEach(d => {
        const is5S = d.inspectionType?.toUpperCase() === "5S";
        let photoDisplay = '<span class="text-slate-300">-</span>';
        
        if (typeof d.photo === 'object' && d.photo !== null) {
          let photoCount = Object.values(d.photo).filter(url => url && url !== "ไม่มีรูปถ่าย" && url.trim() !== "").length;
          if(photoCount > 0) photoDisplay = `<span class="text-primary text-xs font-bold bg-primary/10 px-2 py-1 rounded"><i class="fas fa-images"></i> ${photoCount} รูป</span>`;
        } else if (typeof d.photo === 'string' && d.photo !== "ไม่มีรูปถ่าย" && d.photo.trim() !== "") {
          photoDisplay = `<a href="${d.photo}" target="_blank" class="text-primary hover:text-primary/80"><i class="fas fa-image fa-lg"></i></a>`;
        }

        let statusHtml = '';
        if (is5S) {
           const percent = calculate5SScore(d.fullChecklist, d.area);
           const colorClass = percent >= 80 ? 'text-green-600 bg-green-100' : percent >= 50 ? 'text-orange-600 bg-orange-100' : 'text-red-600 bg-red-100';
           statusHtml = `<span class="${colorClass} px-2.5 py-1 rounded-full text-[10px] font-bold"><i class="fas fa-chart-pie"></i> ${percent}%</span>`;
        } else {
           const statusText = d.hasBad ? 'พบปัญหา' : 'ปกติ';
           const statusClass = d.hasBad ? 'bg-red-500 text-white' : 'bg-green-500 text-white';
           statusHtml = `<span class="${statusClass} px-2.5 py-1 rounded-full text-[10px] font-bold shadow-sm">${statusText}</span>`;
        }

        let typeBadgeCls = is5S ? 'bg-gradient-to-r from-green-500 to-green-600' : 'bg-gradient-to-r from-primary to-orange-600';
        let typeIcon = is5S ? 'fa-broom' : 'fa-hard-hat';
        if(d.inspectionType === 'Audit') { typeIcon = 'fa-search'; typeBadgeCls = 'bg-gradient-to-r from-blue-500 to-blue-600'; }
        if(d.inspectionType?.includes('Accident')) { typeIcon = 'fa-fire-extinguisher'; typeBadgeCls = 'bg-gradient-to-r from-red-500 to-red-600'; }

        // Main Row
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition border-b border-slate-100 group";
        tr.innerHTML = `
          <td data-label="เวลา" class="p-3 md:p-4 whitespace-nowrap text-slate-500">${d.timestamp || '-'}</td>
          <td data-label="ประเภท" class="p-3 md:p-4"><span class="${typeBadgeCls} text-white px-2.5 py-1 rounded-full text-[10px] font-bold shadow-sm inline-flex items-center gap-1"><i class="fas ${typeIcon}"></i> ${d.inspectionType}</span></td>
          <td data-label="พื้นที่" class="p-3 md:p-4 font-bold text-slate-700">${d.area || '-'}</td>
          <td data-label="ผู้ตรวจ" class="p-3 md:p-4 text-slate-600">${d.inspector || '-'}</td>
          <td data-label="สถานะรวม" class="p-3 md:p-4">${statusHtml}</td>
          <td data-label="รูปถ่าย" class="p-3 md:p-4 text-center md:text-left">${photoDisplay}</td>
          <td data-label="รายละเอียด" class="p-3 md:p-4 text-right">
            <button class="bg-white border border-slate-200 hover:border-primary hover:text-primary text-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold transition shadow-sm" onclick="toggleDetail('${d.id}')">
              <i class="fas fa-chevron-down mr-1" id="icon-${d.id}"></i> ดูผล
            </button>
          </td>
        `;
        tbody.appendChild(tr);

        // Detail Row
        const detailTr = document.createElement('tr'); 
        detailTr.id = `detail-${d.id}`; 
        detailTr.className = 'hidden bg-slate-50/50';
        
        let detailHtml = `<div class="p-4 md:p-6 w-full">
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <h4 class="bg-slate-100 p-3 border-b border-slate-200 font-bold text-slate-700 text-sm flex items-center gap-2">
              <i class="fas fa-clipboard-check text-primary"></i> รายละเอียดผลการตรวจสอบ
            </h4>
            <div class="p-4 space-y-4">`;
        
        if (is5S) {
          const sections = (CHECKLIST_5S[d.area] || CHECKLIST_5S["OFFICE"])?.sections || [];
          sections.forEach((sec, sIdx) => {
            detailHtml += `<div class="border border-slate-200 rounded-lg overflow-hidden"><div class="bg-slate-50 p-2.5 font-bold text-slate-700 text-xs border-b border-slate-200">${sec.title}</div><div class="divide-y divide-slate-100">`;
            sec.questions.forEach((qText, qIdx) => {
              const res = d.fullChecklist?.[`5s_s${sIdx}_q${qIdx}`];
              const remark = d.fullChecklist?.[`5s_remark_s${sIdx}_q${qIdx}`] || "";
              let statusText = '-', statusClass = '', scoreBadge = '';
              
              if (res === "ดี") { statusText = '✔ ดี'; statusClass = 'bg-green-50 text-green-700 border-green-200'; scoreBadge = '<span class="bg-green-600 text-white px-1.5 py-0.5 rounded text-[9px] ml-2 font-bold">+2</span>'; }
              else if (res === "พอใช้") { statusText = '🔶 พอใช้'; statusClass = 'bg-orange-50 text-orange-700 border-orange-200'; scoreBadge = '<span class="bg-orange-500 text-white px-1.5 py-0.5 rounded text-[9px] ml-2 font-bold">+1</span>'; }
              else if (res === "ปรับปรุง") { statusText = '✘ ปรับปรุง'; statusClass = 'bg-red-50 text-red-700 border-red-200'; scoreBadge = '<span class="bg-red-600 text-white px-1.5 py-0.5 rounded text-[9px] ml-2 font-bold">0</span>'; }
              
              detailHtml += `<div class="p-3 flex flex-col md:flex-row md:items-start justify-between gap-3 hover:bg-slate-50 transition">
                <div class="text-xs text-slate-700 leading-relaxed flex-1">
                  <span class="font-semibold">&bull; ${qText}</span> ${scoreBadge}
                  ${remark ? `<div class="mt-2 bg-orange-50 border-l-2 border-primary text-orange-800 p-2 rounded text-[10px]"><i class="fas fa-comment-dots opacity-50 mr-1"></i> ${remark}</div>` : ''}
                </div>
                <div class="border ${statusClass} px-3 py-1 rounded-md text-[10px] font-bold text-center shrink-0 self-start">${statusText}</div>
              </div>`;
            });
            detailHtml += `</div></div>`;
          });
        } else {
          const checklist = getSafetyChecklist(d.area);
          for(let secKey in checklist) {
            const section = checklist[secKey]; const sNum = secKey.replace('s', '');
            detailHtml += `<div class="border border-slate-200 rounded-lg overflow-hidden"><div class="bg-slate-50 p-2.5 font-bold text-slate-700 text-xs border-b border-slate-200">${section.title}</div><div class="divide-y divide-slate-100">`;
            
            section.questions.forEach((qText, idx) => {
              const res = d.fullChecklist?.[`section${sNum}_q${idx}`];
              const remark = d.fullChecklist?.[`section${sNum}_remark${idx}`];
              const isBad = res === "ไม่ดี";
              let displayQText = qText;
              
              if(secKey === 's1' && qText === 'Water Mist' && d.fullChecklist?.['water_val']) {
                displayQText += ` <span class="text-orange-600 font-bold bg-orange-100 px-1.5 py-0.5 rounded text-[10px] ml-1">(${d.fullChecklist['water_val']}%)</span>`;
              }
              
              let qPhotoPreviews = "";
              if(typeof d.photo === 'object' && d.photo !== null) {
                 for(let p = 0; p < 3; p++) {
                    let pKey = `${secKey}_q${idx}_${p}`;
                    if(d.photo[pKey] && d.photo[pKey] !== "") {
                       let thumbUrl = getDriveThumbnailUrl(d.photo[pKey]);
                       let imgCaption = d.fullChecklist?.[`caption_${pKey}`] || "";
                       qPhotoPreviews += `<div class="mt-2 inline-flex flex-col items-center mr-2"><a href="${d.photo[pKey]}" target="_blank"><img src="${thumbUrl}" class="w-16 h-16 object-cover rounded-lg border border-slate-300 hover:scale-110 transition bg-slate-100"></a>${imgCaption ? `<span class="text-[9px] text-slate-500 mt-1 max-w-[64px] truncate">${imgCaption}</span>` : ''}</div>`;
                    }
                 }
              }
              
              detailHtml += `<div class="p-3 flex flex-col md:flex-row md:items-start justify-between gap-3 hover:bg-slate-50 transition">
                <div class="text-xs text-slate-700 leading-relaxed flex-1">
                  <span class="font-medium">- ${displayQText}</span>
                  ${remark ? `<div class="mt-2 bg-red-50 border-l-2 border-red-500 text-red-800 p-2 rounded text-[10px]"><b>หมายเหตุ:</b> ${remark}</div>` : ''}
                  ${qPhotoPreviews !== "" ? `<div class="flex flex-wrap">${qPhotoPreviews}</div>` : ''}
                </div>
                <div class="${isBad ? 'bg-red-100 text-red-700' : (res === 'ดี' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500')} px-3 py-1 rounded-md text-[10px] font-bold text-center shrink-0 self-start">
                  ${isBad ? '✘ ไม่ปกติ' : (res === "ดี" ? '✔ ปกติ' : '-')}
                </div>
              </div>`;
            });
            detailHtml += `</div></div>`;
          }
        }
        detailHtml += `</div></div></div>`;
        detailTr.innerHTML = `<td colspan="7" class="p-0 border-b border-slate-200">${detailHtml}</td>`;
        tbody.appendChild(detailTr);
      });
    }

    function toggleDetail(id) {
      const row = document.getElementById('detail-' + id);
      const icon = document.getElementById('icon-' + id);
      const isVisible = !row.classList.contains('hidden');
      
      if(isVisible) {
        row.classList.add('hidden');
        icon.classList.replace('fa-chevron-up', 'fa-chevron-down');
      } else {
        row.classList.remove('hidden');
        icon.classList.replace('fa-chevron-down', 'fa-chevron-up');
      }
    }
  </script>
</body>
</html>
