        document.documentElement.style.setProperty('--color-primary', sysSettings.primaryColor);
        document.documentElement.style.setProperty('--color-secondary', sysSettings.secondaryColor);
        document.documentElement.style.setProperty('--font-family', sysSettings.fontFamily);

    function getDriveThumbnailUrl(url) {
      if(!url) return "";
      let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if(match && match[1]) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w500`;
      return url;
    }

    function calculate5SScore(checklist, areaStr) {
      const areaData = CHECKLIST_5S[areaStr] || CHECKLIST_5S["OFFICE"];
      const sections = areaData?.sections || [];
      let total = 0, max = 0;
      sections.forEach((sec, sIdx) => {
        const questions = sec.questions || sec.qs || [];
        questions.forEach((_, qIdx) => {
          const val = checklist?.[`5s_s${sIdx}_q${qIdx}`];
          max += 2;
          if (val === "ดี") total += 2;
          else if (val === "พอใช้") total += 1;
        });
      });
      return max > 0 ? Math.round((total / max) * 100) : 0;
    }

    function loadData() {
      const loader = document.getElementById('loader'); 
      loader.classList.remove('hidden'); loader.classList.add('flex');
      fetch(API_URL + "?action=getDashboardData")
      .then(r => r.json()).then(data => {
        rawData = data.details || [];
        rawData.forEach(d => {
          if (!d.inspectionType) d.inspectionType = "Safety";
          if (d.inspectionType.toUpperCase() === "5S" && d.fullChecklist) {
            d.hasBad = Object.values(d.fullChecklist).includes("ปรับปรุง") || Object.values(d.fullChecklist).includes("ไม่ดี");
          }
        });
        renderTable(); 
        loader.classList.remove('flex'); loader.classList.add('hidden');
      }).catch(err => { 
        loader.classList.remove('flex'); loader.classList.add('hidden'); 
        console.error("Error:", err); 
      });
    }

    function selectTypeFilter(type, el) { 
      currentType = type; 
      document.querySelectorAll('.type-btn').forEach(b => {
        b.classList.remove('active', 'border-primary', 'bg-amber-50/30', 'text-amber-700', 'border-emerald-500', 'bg-emerald-50/30', 'text-emerald-700');
      });
      if(type === '5S') {
        el.classList.add('border-emerald-500', 'bg-emerald-50/30', 'text-emerald-700');
      } else {
        el.classList.add('border-primary', 'bg-amber-50/30', 'text-amber-700');
      }
      renderTable(); 
    }

    function updateStatusFilter(status) { 
      currentStatus = status; 
      document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('border-blue-500', 'border-emerald-500', 'border-rose-500', 'shadow-md'));
      const activeCard = document.getElementById('card-' + status);
      const color = status === 'all' ? 'border-blue-500' : (status === 'good' ? 'border-emerald-500' : 'border-rose-500');
      activeCard.classList.add(color, 'shadow-md');
      renderTable(); 
    }

    function renderTable() {
      let filtered = [...rawData];
      const dateVal = document.getElementById('dateFilter').value;
      if (dateVal) filtered = filtered.filter(d => d.timestamp?.startsWith(dateVal));
      if (currentType !== 'all') filtered = filtered.filter(d => d.inspectionType?.toUpperCase() === currentType.toUpperCase());
      
      const t = filtered.length, b = filtered.filter(d => d.hasBad).length, g = t - b;
      document.getElementById('countTotal').innerText = t; 
      document.getElementById('countGood').innerText = g; 
      document.getElementById('countBad').innerText = b;
      
      if (currentStatus === 'good') filtered = filtered.filter(d => !d.hasBad);
      if (currentStatus === 'bad') filtered = filtered.filter(d => d.hasBad);

      const tbody = document.getElementById('tableBody'); 
      tbody.innerHTML = '';
      if(filtered.length === 0) { 
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-12 text-slate-400 font-medium"><i class="fas fa-folder-open text-4xl opacity-30 block mb-3"></i> ไม่พบข้อมูลตามเงื่อนไขที่เลือก</td></tr>`; 
        return; 
      }

      filtered.forEach(d => {
        const is5S = d.inspectionType?.toUpperCase() === "5S";
        let photoDisplay = '-';
        if (typeof d.photo === 'object' && d.photo !== null) {
          let photoCount = Object.values(d.photo).filter(url => url && url !== "ไม่มีรูปถ่าย" && url.trim() !== "").length;
          if(photoCount > 0) photoDisplay = `<span class="text-primary font-semibold text-xs bg-amber-50 border border-amber-200 px-2 py-1 rounded-lg"><i class="fas fa-images mr-1"></i> ${photoCount} รูป</span>`;
        } else if (typeof d.photo === 'string' && d.photo !== "ไม่มีรูปถ่าย" && d.photo.trim() !== "") {
          photoDisplay = `<a href="${d.photo}" target="_blank" class="text-primary hover:text-secondary"><i class="fas fa-image text-lg"></i></a>`;
        }

        let statusHtml = '';
        if (is5S) {
          const percent = calculate5SScore(d.fullChecklist, d.area);
          const bg = percent >= 80 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : (percent >= 50 ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-rose-50 text-rose-700 border-rose-200');
          statusHtml = `<span class="border px-2.5 py-1 rounded-full text-xs font-bold ${bg}"><i class="fas fa-chart-pie mr-1"></i> ${percent}%</span>`;
        } else {
          const bg = d.hasBad ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200';
          statusHtml = `<span class="border px-2.5 py-1 rounded-full text-xs font-bold ${bg}">${d.hasBad ? 'พบปัญหา' : 'ปกติ'}</span>`;
        }

        let badgeStyle = is5S ? 'from-emerald-500 to-teal-600' : 'from-amber-500 to-orange-500';
        let typeIcon = is5S ? 'fa-broom' : 'fa-hard-hat';
        if(d.inspectionType === 'Audit') typeIcon = 'fa-search';
        if(d.inspectionType?.includes('Accident')) typeIcon = 'fa-fire-extinguisher';

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50/50 transition duration-150";
        tr.innerHTML = `
          <td class="px-5 py-3.5 text-slate-500 font-medium">${d.timestamp || '-'}</td>
          <td class="px-5 py-3.5"><span class="bg-gradient-to-r ${badgeStyle} text-white px-2.5 py-1 rounded-lg text-xs font-semibold inline-flex items-center gap-1"><i class="fas ${typeIcon}"></i> ${d.inspectionType}</span></td>
          <td class="px-5 py-3.5 font-bold text-slate-700">${d.area || '-'}</td>
          <td class="px-5 py-3.5 text-slate-600">${d.inspector || '-'}</td>
          <td class="px-5 py-3.5 text-center">${statusHtml}</td>
          <td class="px-5 py-3.5 text-center">${photoDisplay}</td>
          <td class="px-5 py-3.5 text-center"><button class="text-xs font-bold px-3 py-1.5 bg-slate-100 text-slate-600 rounded-xl hover:bg-primary hover:text-white transition inline-flex items-center gap-1" onclick="toggleDetail('${d.id}')"><i class="fas fa-chevron-down" id="icon-${d.id}"></i> ดูผลตรวจ</button></td>
        `;
        tbody.appendChild(tr);

        // Details Row Box
        const detailTr = document.createElement('tr'); 
        detailTr.id = `detail-${d.id}`; 
        detailTr.className = 'hidden bg-slate-50/50';
        
        let detailHtml = `<div class="p-4 sm:p-6 bg-slate-50 border border-slate-200 rounded-2xl m-4 shadow-inner"><h4 class="text-sm font-bold text-slate-700 mb-4 pb-2 border-b-2 border-primary/30 flex items-center gap-2"><i class="fas fa-clipboard-check text-primary"></i> รายละเอียดผลการตรวจสอบอย่างละเอียด</h4>`;
        
        if (is5S) {
          const sections = (CHECKLIST_5S[d.area] || CHECKLIST_5S["OFFICE"])?.sections || [];
          sections.forEach((sec, sIdx) => {
            detailHtml += `<div class="mb-4 rounded-xl overflow-hidden border border-slate-200/60 shadow-sm"><div class="bg-emerald-600 text-white px-4 py-2.5 font-semibold text-xs tracking-wide">${sec.title}</div>`;
            sec.questions.forEach((qText, qIdx) => {
              const res = d.fullChecklist?.[`5s_s${sIdx}_q${qIdx}`];
              const remark = d.fullChecklist?.[`5s_remark_s${sIdx}_q${qIdx}`] || "";
              let pillBg = 'bg-slate-100 text-slate-400', badgeScore = '0';
              if (res === "ดี") { pillBg = 'bg-emerald-50 text-emerald-700 border-emerald-200'; badgeScore = '+2'; }
              else if (res === "พอใช้") { pillBg = 'bg-amber-50 text-amber-700 border-amber-200'; badgeScore = '+1'; }
              else if (res === "ปรับปรุง") { pillBg = 'bg-rose-50 text-rose-700 border-rose-200'; badgeScore = '0'; }
              
              detailHtml += `
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start p-4 bg-white border-b border-slate-100 last:border-b-0 gap-2">
                  <div class="text-slate-600 text-xs font-medium">• ${qText} <span class="ml-2 bg-slate-100 text-slate-600 text-[10px] px-1.5 py-0.5 rounded font-bold">${badgeScore}</span>
                    ${remark ? `<div class="mt-2 text-xs p-2.5 bg-rose-50/50 border-l-4 border-rose-400 text-rose-700 rounded-r-lg font-medium"><i class="fas fa-comment-dots mr-1"></i> ${remark}</div>` : ''}
                  </div>
                  <div class="border px-3 py-1 rounded-lg text-xs font-bold self-start sm:self-center ${pillBg}">${res || '-'}</div>
                </div>`;
            });
            detailHtml += `</div>`;
          });
        } else {
          const checklist = getSafetyChecklist(d.area);
          for(let secKey in checklist) {
            const section = checklist[secKey]; 
            const sNum = secKey.replace('s', '');
            detailHtml += `<div class="mb-4 rounded-xl overflow-hidden border border-slate-200/60 shadow-sm"><div class="bg-primary text-white px-4 py-2.5 font-semibold text-xs tracking-wide">${section.title}</div>`;
            section.questions.forEach((qText, idx) => {
              const res = d.fullChecklist?.[`section${sNum}_q${idx}`];
              const remark = d.fullChecklist?.[`section${sNum}_remark${idx}`];
              const isBad = res === "ไม่ดี";
              let displayQText = qText;
              if(secKey === 's1' && qText === 'Water Mist' && d.fullChecklist?.['water_val']) {
                displayQText += ` <span class="text-orange-600 font-bold">(${d.fullChecklist['water_val']}%)</span>`;
              }
              
              let qPhotoPreviews = "";
              if(typeof d.photo === 'object' && d.photo !== null) {
                 for(let p = 0; p < 3; p++) {
                    let pKey = `${secKey}_q${idx}_${p}`;
                    if(d.photo[pKey] && d.photo[pKey] !== "") {
                       let thumbUrl = getDriveThumbnailUrl(d.photo[pKey]);
                       let imgCaption = d.fullChecklist?.[`caption_${pKey}`] || "";
                       qPhotoPreviews += `
                        <div class="flex flex-col items-center w-24 border border-slate-200 p-1 bg-slate-50 rounded-lg mt-2 mr-2">
                          <a href="${d.photo[pKey]}" target="_blank"><img src="${thumbUrl}" class="w-full h-16 object-cover rounded shadow-sm hover:scale-105 transition"></a>
                          ${imgCaption ? `<span class="text-[10px] text-slate-500 text-center mt-1 truncate w-full">${imgCaption}</span>` : ''}
                        </div>`;
                    }
                 }
              }
              const pillBg = isBad ? 'bg-rose-50 text-rose-700 border-rose-200' : (res === 'ดี' || res === 'ปกติ' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-50 text-slate-400');
              detailHtml += `
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start p-4 bg-white border-b border-slate-100 last:border-b-0 gap-2">
                  <div class="text-slate-600 text-xs font-medium">- ${displayQText}
                    ${remark ? `<div class="mt-2 text-xs p-2.5 bg-amber-50 border-l-4 border-amber-400 text-amber-800 rounded-r-lg font-medium"><b>หมายเหตุ:</b> ${remark}</div>` : ''} 
                    ${qPhotoPreviews !== "" ? `<div class="flex flex-wrap mt-1">${qPhotoPreviews}</div>` : ''}
                  </div>
                  <div class="border px-3 py-1 rounded-lg text-xs font-bold self-start sm:self-center ${pillBg}">${isBad ? '✘ ไม่ปกติ' : (res === 'ดี' || res === 'ปกติ' ? '✔ ปกติ' : '-')}</div>
                </div>`;
            });
            detailHtml += `</div>`;
          }
        }
        detailHtml += `</div>`;
        detailTr.innerHTML = `<td colspan="7" class="p-0">${detailHtml}</td>`;
        tbody.appendChild(detailTr);
      });
    }

    function toggleDetail(id) {
      const row = document.getElementById('detail-' + id);
      const icon = document.getElementById('icon-' + id);
      const isHidden = row.classList.contains('hidden');
      
      if (isHidden) {
        row.classList.remove('hidden');
        if (window.innerWidth <= 768) row.style.display = 'block'; else row.style.display = 'table-row';
        icon.className = 'fas fa-chevron-up';
      } else {
        row.classList.add('hidden');
        row.style.display = 'none';
        icon.className = 'fas fa-chevron-down';
      }
    }
  </script>
</body>
</html>
