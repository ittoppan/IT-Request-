        { title: "3. ป้อมยาม", questions: ["จัดเก็บเอกสารเรียบร้อยและทำความสะอาดสม่ำเสมอ", "อุปกรณ์ต่างๆ สามารถหยิบใช้ได้สะดวก", "การกำหนดจำนวนอุปกรณ์บนโต๊ะทำงาน"] },
        { title: "4. ห้องสุขา (ป้อมรปภ.)", questions: ["ทำความสะอาดกระจก / พื้น / โถชักโครก / ผนัง", "กระดาษชำระ สบู่ ผ้าเช็ดมือ ดูแลอย่าให้ขาด"] },
        { title: "5. สภาพแวดล้อมทั่วไป", questions: ["ไม่มีสิ่งของที่ไม่จำเป็น", "ถังขยะอยู่ในตำแหน่งที่เหมาะสมและมีป้ายชี้บ่ง", "มีการกำหนดที่วางอุปกรณ์ทำความสะอาด"] },
        { title: "6. ถังแก๊ส/ถังก๊าซ", questions: ["ระบุป้ายชี้บ่งให้ชัดเจน", "เก็บถังในลักษณะตั้งตรงและมีเครื่องป้องกันการล้ม", "ไม่วางสิ่งของที่ไม่จำเป็นรอบๆ บริเวณ"] },
        { title: "7. โรงจอดรถ", questions: ["จอดรถเป็นระเบียบไม่มีความเสี่ยงอุบัติเหตุ", "หลังคา พื้น ที่กั้น มีสภาพปกติไม่เสียหาย"] }
      ]}
    };

    let rawData = [], currentType = 'all', currentStatus = 'all';

    window.onload = function() { document.getElementById('dateFilter').valueAsDate = new Date(); loadData(); };
    function clearDateFilter() { document.getElementById('dateFilter').value = ""; renderTable(); }

    function getDriveThumbnailUrl(url) { if(!url) return ""; let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/); if(match && match[1]) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=500`; return url; }

    function calculate5SScore(checklist, areaStr) {
      const areaData = CHECKLIST_5S[areaStr] || CHECKLIST_5S["OFFICE"]; const sections = areaData?.sections || [];
      let total = 0, max = 0;
      sections.forEach((sec, sIdx) => {
        const questions = sec.questions || [];
        questions.forEach((_, qIdx) => { const val = checklist?.[`5s_s${sIdx}_q${qIdx}`]; max += 2; if (val === "ดี") total += 2; else if (val === "พอใช้") total += 1; });
      }); return max > 0 ? Math.round((total / max) * 100) : 0;
    }

    function loadData() {
      const loader = document.getElementById('loader'); loader.classList.add('flex'); loader.classList.remove('hidden');
      fetch(API_URL + "?action=getDashboardData").then(r => r.json()).then(data => {
        rawData = data.details || [];
        rawData.forEach(d => {
          if (!d.inspectionType) d.inspectionType = "Safety";
          if (d.inspectionType.toUpperCase() === "5S" && d.fullChecklist) { d.hasBad = Object.values(d.fullChecklist).includes("ปรับปรุง") || Object.values(d.fullChecklist).includes("ไม่ดี"); }
        });
        renderTable(); loader.classList.add('hidden'); loader.classList.remove('flex');
      }).catch(err => { loader.classList.add('hidden'); console.error("Error:", err); });
    }

    function selectTypeFilter(type, el) { currentType = type; document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); renderTable(); }
    function updateStatusFilter(status) { currentStatus = status; document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active')); document.getElementById('card-' + status).classList.add('active'); renderTable(); }

    function renderTable() {
      let filtered = [...rawData]; const dateVal = document.getElementById('dateFilter').value;
      if (dateVal) filtered = filtered.filter(d => d.timestamp?.startsWith(dateVal));
      if (currentType !== 'all') filtered = filtered.filter(d => d.inspectionType?.toUpperCase() === currentType.toUpperCase());
      const t = filtered.length, b = filtered.filter(d => d.hasBad).length, g = t - b;
      document.getElementById('countTotal').innerText = t; document.getElementById('countGood').innerText = g; document.getElementById('countBad').innerText = b;
      if (currentStatus === 'good') filtered = filtered.filter(d => !d.hasBad); if (currentStatus === 'bad') filtered = filtered.filter(d => d.hasBad);
      const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
      if(filtered.length === 0) { tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400 font-semibold"><i class="fas fa-folder-open text-xl mb-1 block"></i> ไม่พบข้อมูลบันทึกรายการตรวจ</td></tr>`; return; }

      filtered.forEach(d => {
        const is5S = d.inspectionType?.toUpperCase() === "5S"; let photoDisplay = '-';
        if (typeof d.photo === 'object' && d.photo !== null) {
          let photoCount = Object.values(d.photo).filter(url => url && url !== "ไม่มีรูปถ่าย" && url.trim() !== "").length;
          if(photoCount > 0) photoDisplay = `<span class="text-xs font-bold text-[#003566]"><i class="fas fa-images"></i> ${photoCount} รูป</span>`;
        } else if (typeof d.photo === 'string' && d.photo !== "ไม่มีรูปถ่าย" && d.photo.trim() !== "") {
          photoDisplay = `<a href="${d.photo}" target="_blank" class="text-sky-600"><i class="fas fa-image text-base"></i></a>`;
        }
        let statusHtml = '';
        if (is5S) {
           const percent = calculate5SScore(d.fullChecklist, d.area); const color = percent >= 80 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : percent >= 50 ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-rose-50 text-rose-700 border-rose-200';
           statusHtml = `<span class="px-2 py-0.5 border rounded-full text-xs font-bold ${color}">${percent}%</span>`;
        } else {
           statusHtml = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${d.hasBad ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">${d.hasBad ? 'พบปัญหา' : 'ปกติ'}</span>`;
        }
        const tr = document.createElement('tr'); tr.className = "hover:bg-slate-50 transition text-slate-700 font-medium";
        tr.innerHTML = `<td class="p-3 font-mono text-xs">${d.timestamp || '-'}</td><td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold text-white ${is5S ? 'bg-emerald-600' : 'bg-[#003566]'}">${d.inspectionType}</span></td><td class="p-3 font-bold text-slate-800">${d.area || '-'}</td><td class="p-3">${d.inspector || '-'}</td><td class="p-3 text-center">${statusHtml}</td><td class="p-3 text-center">${photoDisplay}</td><td class="p-3 text-center"><button class="bg-slate-100 border text-slate-600 px-2 py-1 rounded text-xs font-bold hover:bg-slate-200 transition" onclick="toggleDetail('${d.id}')">ผลตรวจ <i class="fas fa-chevron-down ml-0.5" id="icon-${d.id}"></i></button></td>`;
        tbody.appendChild(tr);

        const detailTr = document.createElement('tr'); detailTr.id = `detail-${d.id}`; detailTr.className = 'hidden bg-slate-50/70';
        let detailHtml = `<div class="p-4 space-y-3"><h4 class="text-xs md:text-sm font-bold text-[#003566] border-b pb-1.5"><i class="fas fa-clipboard-check"></i> รายละเอียดผลการตรวจสอบ</h4>`;
        if (is5S) {
          const sections = (CHECKLIST_5S[d.area] || CHECKLIST_5S["OFFICE"])?.sections || [];
          sections.forEach((sec, sIdx) => {
            detailHtml += `<div class="border rounded-xl bg-white overflow-hidden shadow-2xs"><div class="bg-slate-100/80 px-3 py-2 text-xs font-bold text-slate-700">${sec.title}</div><div class="divide-y text-xs">`;
            sec.questions.forEach((qText, qIdx) => {
              const res = d.fullChecklist?.[`5s_s${sIdx}_q${qIdx}`]; const remark = d.fullChecklist?.[`5s_remark_s${sIdx}_q${qIdx}`] || "";
              let pill = 'text-slate-400', txt = '-'; if (res === "ดี") { pill = 'bg-emerald-50 text-emerald-700'; txt = 'ดี'; } else if (res === "พอใช้") { pill = 'bg-amber-50 text-amber-700'; txt = 'พอใช้'; } else if (res === "ปรับปรุง") { pill = 'bg-rose-50 text-rose-700 font-bold'; txt = 'ปรับปรุง'; }
              detailHtml += `<div class="p-3 flex items-start justify-between gap-2"><div><span class="text-slate-600 font-medium">${qText}</span>${remark ? `<div class="mt-1 text-rose-600 font-semibold text-[11px]"><i class="fas fa-comment-dots"></i> ปัญหา: ${remark}</div>` : ''}</div><span class="px-2 py-0.5 rounded border text-[11px] font-bold shrink-0 ${pill}">${txt}</span></div>`;
            }); detailHtml += `</div></div>`;
          });
        } else {
          const checklist = getSafetyChecklist(d.area);
          for(let secKey in checklist) {
            const section = checklist[secKey]; const sNum = secKey.replace('s', '');
            detailHtml += `<div class="border rounded-xl bg-white overflow-hidden shadow-2xs"><div class="bg-slate-100/80 px-3 py-2 text-xs font-bold text-slate-700">${section.title}</div><div class="divide-y text-xs">`;
            section.questions.forEach((qText, idx) => {
              const res = d.fullChecklist?.[`section${sNum}_q${idx}`]; const remark = d.fullChecklist?.[`section${sNum}_remark${idx}`]; const isBad = res === "ไม่ดี";
              let displayQText = qText; if(secKey === 's1' && qText === 'Water Mist' && d.fullChecklist?.['water_val']) displayQText += ` <span class="text-amber-600 font-bold">(${d.fullChecklist['water_val']}%)</span>`;
              let qPhotoPreviews = "";
              if(typeof d.photo === 'object' && d.photo !== null) {
                 for(let p = 0; p < 3; p++) {
                    let pKey = `${secKey}_q${idx}_${p}`;
                    if(d.photo[pKey] && d.photo[pKey] !== "") {
                       let thumbUrl = getDriveThumbnailUrl(d.photo[pKey]); let imgCaption = d.fullChecklist?.[`caption_${pKey}`] || "";
                       qPhotoPreviews += `<div class="flex flex-col items-center w-16 mt-2 mr-2"><a href="${d.photo[pKey]}" target="_blank"><img src="${thumbUrl}" class="w-16 h-16 object-cover rounded border"></a>${imgCaption ? `<span class="text-[10px] text-slate-500 text-center truncate w-full">${imgCaption}</span>` : ''}</div>`;
                    }
                 }
              }
              detailHtml += `<div class="p-3 flex items-start justify-between gap-2"><div><span class="text-slate-600 font-medium">${displayQText}</span>${remark ? `<div class="mt-1 text-rose-600 font-semibold text-[11px]"><b>รายละเอียด:</b> ${remark}</div>` : ''}${qPhotoPreviews !== "" ? `<div class="flex flex-wrap">${qPhotoPreviews}</div>` : ''}</div><span class="px-2 py-0.5 rounded text-[11px] font-bold shrink-0 ${isBad ? 'bg-rose-100 text-rose-700' : (res === 'ดี'?'bg-emerald-100 text-emerald-700':'text-slate-400')}">${isBad ? '✘ ไม่ปกติ' : (res==='ดี'?'✔ ปกติ':'-')}</span></div>`;
            }); detailHtml += `</div></div>`;
          }
        }
        detailHtml += `</div>`; detailTr.innerHTML = `<td colspan="7" class="p-0">${detailHtml}</td>`; tbody.appendChild(detailTr);
      });
    }

    function toggleDetail(id) {
      const row = document.getElementById('detail-' + id), icon = document.getElementById('icon-' + id);
      const isHidden = row.classList.contains('hidden');
      if (isHidden) { row.classList.remove('hidden'); icon.className = 'fas fa-chevron-up ml-0.5'; }
      else { row.classList.add('hidden'); icon.className = 'fas fa-chevron-down ml-0.5'; }
    }
  </script>
</body>
</html>
