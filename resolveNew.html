<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>อัปเดตผลการแก้ไข | Safety Patrol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24 font-['Prompt']">

  <div id="loading" class="fixed inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center z-[2000]">
    <i class="fas fa-circle-notch text-4xl text-[#003566] animate-spin"></i>
    <p id="loadText" class="mt-3 font-semibold text-slate-600 text-sm">กำลังดึงข้อมูลงาน...</p>
  </div>

  <nav class="bg-[#003566] text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-4 flex flex-wrap items-center justify-between py-3 gap-3">
      <div class="flex items-center gap-2">
        <i class="fas fa-shield-halved text-xl text-sky-400"></i>
        <span class="font-bold tracking-wide text-sm md:text-base">TOPPAN SAFETY & 5S</span>
      </div>
      <div class="flex items-center gap-2 overflow-x-auto text-xs md:text-sm">
        <a href="DashNew.html" class="px-3 py-1.5 rounded hover:bg-white/10 transition flex items-center gap-1"><i class="fas fa-list-check"></i> รายการตรวจ</a>
        <a href="dashboard.html" class="px-3 py-1.5 rounded hover:bg-white/10 transition flex items-center gap-1"><i class="fas fa-chart-pie"></i> ศูนย์ควบคุม</a>
        <a href="reportnew.html" class="px-3 py-1.5 rounded hover:bg-white/10 transition flex items-center gap-1"><i class="fas fa-business-time"></i> Action Plan</a>
        <a href="safety.html" class="px-3 py-1.5 rounded hover:bg-white/10 transition flex items-center gap-1"><i class="fas fa-plus-circle"></i> ตรวจพื้นที่</a>
      </div>
    </div>
  </nav>

  <div class="max-w-xl mx-auto mt-6 px-4">
    <div id="contentArea" class="space-y-4" style="display:none;">
      
      <div class="bg-white rounded-2xl p-5 border border-slate-200 border-t-4 border-t-rose-500 shadow-sm space-y-3">
        <div class="inline-block bg-rose-50 border border-rose-200 text-rose-600 font-bold text-xs px-3 py-1 rounded-full">
          <i class="fas fa-hashtag mr-1"></i><span id="displayJobId">MT-XXXXXX</span>
        </div>
        
        <div class="flex items-center text-sm font-medium text-slate-600 gap-2">
          <i class="fas fa-map-marker-alt text-slate-400 w-5"></i>
          <span class="w-16 shrink-0">พื้นที่:</span>
          <span class="text-slate-800 font-semibold" id="displayArea"></span>
        </div>
        
        <div class="p-3 bg-rose-50 rounded-xl border border-rose-100">
          <div class="flex items-center gap-1 text-xs font-bold text-rose-600 mb-1">
            <i class="fas fa-triangle-exclamation"></i> ปัญหาที่พบ:
          </div>
          <p class="text-sm font-semibold text-rose-700" id="displayRemark"></p>
        </div>
        
        <div class="flex items-start text-xs font-medium text-slate-500 gap-2 pt-1 border-t border-slate-100">
          <i class="fas fa-clipboard-list text-slate-400 mt-0.5 w-5"></i>
          <span>หัวข้อตรวจ: <span id="displayProblem" class="text-slate-700 font-medium"></span></span>
        </div>

        <div id="beforeImgContainer" class="pt-2"></div>
      </div>

      <form id="resolveForm" class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
        <h3 class="text-sm md:text-base font-bold text-[#003566] pb-2 border-b-2 border-sky-100 flex items-center gap-1">
          <i class="fas fa-wrench"></i> บันทึกผลการแก้ไข
        </h3>
        
        <div>
          <label class="block font-semibold text-xs md:text-sm text-slate-700 mb-1.5">1. ผู้ดำเนินการแก้ไข (PIC)</label>
          <input type="text" id="picName" placeholder="ระบุชื่อผู้รับผิดชอบ..." class="w-full p-2.5 rounded-lg border border-slate-300 bg-slate-50 text-sm focus:ring-2 focus:ring-sky-500/20 focus:border-[#003566] outline-none transition" required>
        </div>

        <div>
          <label class="block font-semibold text-xs md:text-sm text-slate-700 mb-1.5">2. รายละเอียดการดำเนินการ</label>
          <textarea id="correctiveAction" rows="3" placeholder="อธิบายสิ่งที่ได้ดำเนินการแก้ไขให้สู่สภาพปกติ..." class="w-full p-2.5 rounded-lg border border-slate-300 bg-slate-50 text-sm focus:ring-2 focus:ring-sky-500/20 focus:border-[#003566] outline-none transition" required></textarea>
        </div>

        <div>
          <label class="block font-semibold text-xs md:text-sm text-slate-700 mb-1.5">3. ถ่ายภาพหลังแก้ไข (After)</label>
          
          <div id="previewWrapper" class="relative hidden mb-3 rounded-xl overflow-hidden border-2 border-emerald-500 group shadow-md">
            <img id="afterPreview" class="w-full max-h-[250px] object-cover" src="">
            <button type="button" class="absolute top-2 right-2 bg-black/60 hover:bg-rose-600 text-white w-8 h-8 rounded-full flex items-center justify-center transition duration-200" onclick="resetImage()"><i class="fas fa-trash-alt text-xs"></i></button>
          </div>

          <div class="p-6 bg-sky-50 border-2 border-dashed border-sky-500 text-center rounded-xl cursor-pointer hover:bg-sky-100/70 transition flex flex-col items-center justify-center gap-2" id="cameraBtn" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-camera text-2xl text-[#003566]"></i>
            <p class="text-xs md:text-sm font-bold text-[#003566]">แตะเพื่อถ่ายภาพผลงาน (บังคับ)</p>
          </div>
          <input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden" onchange="processImage(this)">
        </div>

        <button type="submit" class="w-full mt-4 bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-3.5 rounded-xl font-bold shadow-md hover:shadow-lg transition flex items-center justify-center gap-1.5">
          <i class="fas fa-check-circle"></i> ยืนยันปิดงาน (Close Job)
        </button>
      </form>

    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwHIUI1ZbFYKeBK7_fkEI6_hfhhhDTxE0fjltus2i-TI7pvhM2CN1HaKDIy4cgXUNT5gQ/exec";
    let currentJobId = ""; let base64AfterImg = "";

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      currentJobId = urlParams.get('jobid');
      if(!currentJobId) {
        Swal.fire({ title:'ไม่พบงาน', text:'ไม่พบหมายเลขงานในลิงก์', icon:'error', confirmButtonColor: '#003566' });
        document.getElementById('loading').style.display = 'none'; return;
      }
      fetch(API_URL + "?action=getJobDetails&jobid=" + currentJobId)
      .then(res => res.json()).then(data => {
        document.getElementById('loading').style.display = 'none';
        if(data.status === "success") {
           if(data.jobStatus === "Closed") {
             Swal.fire({ title: 'งานนี้ปิดไปแล้ว', text: 'งานนี้ได้รับการแก้ไขและปิดสถานะไปเรียบร้อยแล้ว', icon: 'info', confirmButtonColor: '#003566' }).then(() => { history.back(); });
             return;
           }
           document.getElementById('contentArea').style.display = 'block';
           document.getElementById('displayJobId').innerText = data.jobId;
           document.getElementById('displayArea').innerText = data.area;
           document.getElementById('displayProblem').innerText = data.problem;
           document.getElementById('displayRemark').innerText = data.remark;
           if(data.picBefore && data.picBefore !== "-") {
             let match = data.picBefore.match(/\/d\/([a-zA-Z0-9_-]+)/);
             let thumb = match ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w600` : data.picBefore;
             document.getElementById('beforeImgContainer').innerHTML = `
                <div class="text-xs font-semibold text-slate-500 mb-1 flex items-center gap-1"><i class="fas fa-image"></i> ภาพถ่ายตอนพบปัญหา:</div>
                <img src="${thumb}" class="w-full max-h-[200px] object-cover rounded-xl border border-slate-200 cursor-pointer" onclick="window.open('${data.picBefore}')">
             `;
           }
        } else {
           Swal.fire({ title: 'ไม่พบข้อมูล', text: data.message, icon: 'error', confirmButtonColor: '#003566' });
        }
      })
      .catch(err => {
        document.getElementById('loading').style.display = 'none';
        Swal.fire({ title: 'เชื่อมต่อล้มเหลว', text: 'โปรดตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', icon: 'error', confirmButtonColor: '#003566' });
      });
    };

    function processImage(input) {
      if (input.files && input.files[0]) {
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('loadText').innerText = 'กำลังประมวลผลรูปภาพ...';
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas'); const MAX_WIDTH = 800; 
            let width = img.width; let height = img.height;
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            canvas.width = width; canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            base64AfterImg = canvas.toDataURL("image/jpeg", 0.7);
            document.getElementById('afterPreview').src = base64AfterImg;
            document.getElementById('previewWrapper').style.display = 'block';
            document.getElementById('cameraBtn').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
          }; img.src = e.target.result;
        }; reader.readAsDataURL(input.files[0]);
      }
    }

    function resetImage() {
      base64AfterImg = ""; document.getElementById('fileInput').value = "";
      document.getElementById('previewWrapper').style.display = 'none';
      document.getElementById('cameraBtn').style.display = 'flex';
    }

    document.getElementById('resolveForm').onsubmit = function(e) {
      e.preventDefault();
      if(!base64AfterImg) {
        Swal.fire({ title: 'กรุณาถ่ายภาพ', text: 'ต้องมีรูปถ่ายหลังการแก้ไข (After) เสมอ', icon: 'warning', confirmButtonColor: '#F59E0B' });
        return;
      }
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('loadText').innerText = 'กำลังส่งข้อมูลและส่งอีเมล...';
      const payload = {
        action: "resolve_issue", jobId: currentJobId,
        picName: document.getElementById('picName').value,
        correctiveAction: document.getElementById('correctiveAction').value,
        afterImage: base64AfterImg
      };
      fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
      .then(res => res.json()).then(res => {
        document.getElementById('loading').style.display = 'none';
        if(res.status === 'success') {
           Swal.fire({ title: 'ยอดเยี่ยม!', text: 'บันทึกการแก้ไขและส่งอีเมลปิดงานสำเร็จ', icon: 'success', confirmButtonColor: '#10B981' })
           .then(() => { window.location.href = "reportnew.html"; });
        } else { Swal.fire('เกิดข้อผิดพลาด', res.message, 'error'); }
      })
      .catch(err => {
        document.getElementById('loading').style.display = 'none';
        Swal.fire('เกิดข้อผิดพลาด', 'ระบบเครือข่ายมีปัญหา', 'error');
      });
    };
  </script>
  <script>
  // โค้ดดักจับว่าเปิดผ่านเบราว์เซอร์ของ LINE หรือไม่
  window.addEventListener('load', function() {
    if (navigator.userAgent.indexOf("Line") > -1) {
      // สร้างแถบแจ้งเตือนสีแดงด้านบนสุดของจอ
      const lineAlert = document.createElement('div');
      lineAlert.style.cssText = "position:fixed; top:0; left:0; width:100%; background:#ef4444; color:white; padding:15px; text-align:center; z-index:99999; font-family:'Prompt', sans-serif; font-size:14px; font-weight:600; box-shadow:0 4px 6px rgba(0,0,0,0.1);";
      lineAlert.innerHTML = `
        <div style="font-size:16px; margin-bottom:5px;"><i class="fas fa-exclamation-triangle"></i> คุณกำลังเปิดผ่านแอป LINE</div>
        เพื่อป้องกันปัญหากล้องค้างหรือไม่บันทึกภาพ<br>
        กรุณากดไอคอน <b style="background:rgba(0,0,0,0.2); padding:2px 6px; border-radius:4px;">[ จุด 3 จุด ]</b> หรือ <b style="background:rgba(0,0,0,0.2); padding:2px 6px; border-radius:4px;">[ แชร์ ]</b> มุมขวาบน<br>
        แล้วเลือก <b>"เปิดในเบราว์เซอร์เริ่มต้น"</b> (Open in Browser)
        <div style="margin-top:10px;">
          <button onclick="this.parentElement.parentElement.remove()" style="background:white; color:#ef4444; padding:5px 15px; border-radius:6px; border:none; font-weight:bold;">เข้าใจแล้ว ปิดหน้าต่างนี้</button>
        </div>
      `;
      document.body.appendChild(lineAlert);
    }
  });
</script>
</body>
</html>
