<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - ตั้งค่าระบบ Safety</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-20 lg:pb-0">

  <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex items-center shadow-md">
    <button onclick="window.location.href='index.html'" class="mr-4 hover:text-gray-300"><i class="fas fa-arrow-left text-lg"></i></button>
    <h1 class="text-lg font-bold">Admin Settings</h1>
  </nav>

  <main class="max-w-2xl mx-auto p-4 mt-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-xl font-bold mb-6 text-slate-800 border-b pb-3"><i class="fas fa-cogs text-blue-500 mr-2"></i> ปรับแต่งการแสดงผล</h2>
      
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">ชื่อระบบ (Header Title)</label>
          <input type="text" id="setAppName" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="เช่น SAFETY & 5S DASHBOARD">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">สีหลักของระบบ (Primary Theme Color)</label>
          <div class="flex items-center gap-4">
            <input type="color" id="setAppColor" class="h-12 w-20 cursor-pointer rounded-lg border border-slate-300">
            <span class="text-sm text-slate-500">เลือกสีสำหรับปุ่มและแถบเมนูหลัก</span>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">แบบอักษร (Font Family)</label>
          <select id="setAppFont" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="'Prompt', sans-serif">Prompt (ทันสมัย / ค่าเริ่มต้น)</option>
            <option value="'Sarabun', sans-serif">Sarabun (ทางการ)</option>
          </select>
        </div>
      </div>

      <div class="mt-8 flex gap-4">
        <button onclick="saveSettings()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-md"><i class="fas fa-save mr-2"></i> บันทึกการตั้งค่า</button>
        <button onclick="resetSettings()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-6 rounded-xl transition"><i class="fas fa-undo"></i></button>
      </div>
    </div>
  </main>

  <nav class="lg:hidden fixed bottom-0 left-0 right-0 h-16 bg-white border-t border-slate-200 flex justify-around items-center z-50">
    <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-blue-600"><i class="fas fa-chart-pie"></i><span class="text-[10px] font-bold">แดชบอร์ด</span></a>
    <a href="check.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-blue-600"><i class="fas fa-clipboard-check"></i><span class="text-[10px] font-bold">ตรวจพื้นที่</span></a>
    <a href="report.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-blue-600"><i class="fas fa-list"></i><span class="text-[10px] font-bold">รายการ</span></a>
    <a href="admin.html" class="flex flex-col items-center gap-1 text-blue-600"><i class="fas fa-cog"></i><span class="text-[10px] font-bold">ตั้งค่า</span></a>
  </nav>

  <script>
    // โหลดค่าเดิมมาแสดง
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('setAppName').value = localStorage.getItem('appName') || 'SAFETY & 5S PATROL';
      document.getElementById('setAppColor').value = localStorage.getItem('appColor') || '#f39c12'; // สีส้มเดิม
      document.getElementById('setAppFont').value = localStorage.getItem('appFont') || "'Prompt', sans-serif";
    });

    function saveSettings() {
      localStorage.setItem('appName', document.getElementById('setAppName').value);
      localStorage.setItem('appColor', document.getElementById('setAppColor').value);
      localStorage.setItem('appFont', document.getElementById('setAppFont').value);
      alert('บันทึกการตั้งค่าเรียบร้อยแล้ว');
      window.location.href = 'index.html'; // กลับไปหน้าแรกเพื่อดูผลลัพธ์
    }

    function resetSettings() {
      localStorage.clear();
      location.reload();
    }
  </script>
</body>
</html>
