<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Executive Safety & 5S Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'sans-serif'], inter: ['Inter', 'sans-serif'] },
          colors: { 
            safety: { light: '#fee2e2', DEFAULT: '#ef4444', dark: '#b91c1c' },
            fiveS: { light: '#dbeafe', DEFAULT: '#3b82f6', dark: '#1d4ed8' },
            darkBg: '#0f172a', darkCard: '#1e293b'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f1f5f9; color: #334155; transition: background-color 0.3s, color 0.3s; }
    body.dark { background-color: #0f172a; color: #e2e8f0; }
    .kpi-card { background: #fff; border-radius: 1rem; padding: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; transition: all 0.3s; }
    .dark .kpi-card { background: #1e293b; border-color: #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .tab-btn { padding: 0.75rem 1.5rem; font-weight: 600; font-size: 0.875rem; border-bottom: 3px solid transparent; color: #64748b; transition: all 0.2s; cursor: pointer; }
    .dark .tab-btn { color: #94a3b8; }
    .tab-btn.active-safety { border-color: #ef4444; color: #ef4444; }
    .tab-btn.active-5s { border-color: #3b82f6; color: #3b82f6; }
    .tab-btn.active-exec { border-color: #8b5cf6; color: #8b5cf6; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <div id="loader" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center z-[9999] transition-opacity duration-300">
    <div class="bg-white dark:bg-darkCard p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-sm w-[90%] text-center border dark:border-slate-700">
      <div class="w-16 h-16 border-4 border-slate-100 dark:border-slate-700 border-t-sky-500 rounded-full animate-spin"></div>
      <div class="font-bold text-slate-800 dark:text-white text-lg mt-5">Loading Dashboard...</div>
      <div class="text-xs text-slate-500 dark:text-slate-400 mt-2">Connecting to Data Center</div>
    </div>
  </div>

  <nav class="bg-[#002548] text-white shrink-0 shadow-lg z-50">
    <div class="px-4 sm:px-6 flex items-center justify-between py-3">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-sky-500/20 rounded flex items-center justify-center border border-sky-500/30">
          <i class="fas fa-industry text-sky-400"></i>
        </div>
        <div>
          <div class="font-black tracking-widest text-sm font-inter leading-none">EXECUTIVE DASHBOARD</div>
          <div class="text-[10px] text-sky-200 font-medium mt-0.5">Toppan Industrial KPI System</div>
        </div>
      </div>
      <div class="flex items-center gap-4 text-sm">
        <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 transition flex items-center justify-center">
          <i class="fas fa-moon" id="themeIcon"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="flex flex-1 overflow-hidden">
    <aside class="w-64 bg-white dark:bg-darkCard border-r border-slate-200 dark:border-slate-700 hidden md:flex flex-col shrink-0 overflow-y-auto">
      <div class="p-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50">
        <h2 class="font-bold text-sm text-slate-700 dark:text-slate-200"><i class="fas fa-filter text-sky-500 mr-2"></i>Global Filters</h2>
      </div>
      <div class="p-4 space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">📅 Date Range (Month)</label>
          <input type="month" id="monthFilter" onchange="applyFilters()" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 dark:text-white outline-none focus:border-sky-500 transition shadow-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">📍 Department / Area</label>
          <select id="deptFilter" onchange="applyFilters()" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 dark:text-white outline-none focus:border-sky-500 transition shadow-sm">
            <option value="all">-- All Departments --</option>
          </select>
        </div>
      </div>
    </aside>

    <main class="flex-1 flex flex-col bg-slate-50 dark:bg-[#0f172a] overflow-hidden relative">
      <div class="bg-white dark:bg-darkCard border-b border-slate-200 dark:border-slate-700 shrink-0 overflow-x-auto flex">
        <button onclick="switchTab('safety')" id="btn-safety" class="tab-btn active-safety flex items-center gap-2 whitespace-nowrap"><i class="fas fa-hard-hat"></i> Safety Dashboard</button>
        <button onclick="switchTab('5s')" id="btn-5s" class="tab-btn flex items-center gap-2 whitespace-nowrap"><i class="fas fa-broom"></i> 5S Dashboard</button>
      </div>

      <div class="flex-1 overflow-y-auto p-4 sm:p-6" id="tabContent">
        <div id="tab-safety" class="space-y-6">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="kpi-card border-l-4 border-l-slate-400 flex justify-between items-center">
              <div><div class="text-[10px] font-bold text-slate-400 uppercase">Total Findings</div><div class="text-3xl font-black font-inter text-slate-800 dark:text-white mt-1" id="s_kpiTotal">0</div></div>
            </div>
            <div class="kpi-card border-l-4 border-l-amber-500 flex justify-between items-center">
              <div><div class="text-[10px] font-bold text-slate-400 uppercase">Open Issues</div><div class="text-3xl font-black font-inter text-amber-500 mt-1" id="s_kpiOpen">0</div></div>
            </div>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="kpi-card min-h-[300px] relative"><canvas id="s_chDept"></canvas></div>
            <div class="kpi-card min-h-[300px] relative"><canvas id="s_chCat"></canvas></div>
          </div>
        </div>

        <div id="tab-5s" class="space-y-6 hidden">
          <div class="grid grid-cols-2 lg:grid-cols-2 gap-4">
            <div class="kpi-card border-l-4 border-l-blue-500 flex justify-between items-center">
              <div><div class="text-[10px] font-bold text-slate-400 uppercase">Average 5S Score</div><div class="text-3xl font-black font-inter text-blue-600 mt-1" id="f_kpiAvg">0%</div></div>
            </div>
          </div>
          <div class="grid grid-cols-1 gap-6">
            <div class="kpi-card min-h-[300px] relative"><canvas id="f_chRank"></canvas></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ดึง URL เว็บแอปของคุณโดยตรงจากสคริปต์หลังบ้าน
    const API = "https://script.google.com/macros/s/AKfycbwHIUI1ZbFYKeBK7_fkEI6_hfhhhDTxE0fjltus2i-TI7pvhM2CN1HaKDIy4cgXUNT5gQ/exec";
    
    const DEPTS = ["PRINT","LAMINATE","SOVENTLESS","REWINDER/SLITTER/PACKING","BAG MAKING","QA&QC","WAREHOUSE","OFFICE","CANTEEN","TOILET","LOCKER","ENGINEERING","OUTSIDE"];
    
    let globalRaw = { ins: [], jobs: [] }; 
    let filteredData = { ins: [], jobs: [] };
    let currentTab = 'safety';
    let charts = {};

    function parseDateObj(dateStr) {
      if(!dateStr) return null;
      let d = new Date(dateStr);
      if(!isNaN(d.getTime())) return d;
      return null;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const el = document.getElementById("deptFilter"); 
      DEPTS.forEach(d => el.add(new Option(d, d)));
      loadData();
    });

    async function loadData() {
      try {
        const [dash, jobs] = await Promise.all([
          fetch(`${API}?action=getDashboardData`).then(r => r.json()),
          fetch(`${API}?action=getReport`).then(r => r.json())
        ]);
        
        globalRaw.ins = (dash.details || []);
        globalRaw.jobs = Array.isArray(jobs) ? jobs : []; 
        applyFilters();
      } catch (err) { 
        console.error(err);
      } finally { 
        document.getElementById("loader").classList.add("hidden"); 
      }
    }

    function applyFilters() {
      const dept = document.getElementById("deptFilter").value; 
      filteredData.jobs = globalRaw.jobs.filter(j => dept === "all" || j.area === dept);
      filteredData.ins = globalRaw.ins.filter(i => dept === "all" || i.area === dept);
      renderCurrentTab();
    }

    function switchTab(tabId) {
      currentTab = tabId;
      ['safety', '5s'].forEach(id => {
        document.getElementById(`tab-${id}`).classList.add('hidden');
        document.getElementById(`btn-${id}`).classList.remove(`active-${id}`);
      });
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      document.getElementById(`btn-${tabId}`).classList.add(`active-${tabId}`);
      renderCurrentTab();
    }

    function mkChart(id, cfg) { 
      if (charts[id]) charts[id].destroy(); 
      const c = document.getElementById(id); 
      if (c) charts[id] = new Chart(c.getContext("2d"), cfg); 
    }

    function renderCurrentTab() {
      if (currentTab === 'safety') {
        let kpiTotal = filteredData.jobs.length;
        let kpiClosed = filteredData.jobs.filter(j => j.status === 'Closed').length;
        document.getElementById('s_kpiTotal').innerText = kpiTotal;
        document.getElementById('s_kpiOpen').innerText = kpiTotal - kpiClosed;

        mkChart("s_chDept", {
          type: "bar",
          data: {
            labels: DEPTS,
            datasets: [{ label: "Total Open Finder", data: DEPTS.map(d => filteredData.jobs.filter(j => j.area === d && j.status !== 'Closed').length), backgroundColor: "#ef4444" }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      } else if (currentTab === '5s') {
        const data5S = filteredData.ins.filter(i => i.inspectionType === "5S");
        const scores = data5S.map(i => parseFloat(i.score?.percent)).filter(p => !isNaN(p));
        const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b, 0) / scores.length) : 0;
        document.getElementById("f_kpiAvg").innerText = avg + "%";

        mkChart("f_chRank", {
          type: "bar",
          data: {
            labels: DEPTS,
            datasets: [{ label: "5S Score Avg %", data: DEPTS.map(d => {
              const dData = data5S.filter(i => i.area === d).map(i => parseFloat(i.score?.percent)).filter(p => !isNaN(p));
              return dData.length ? Math.round(dData.reduce((a,b)=>a+b,0)/dData.length) : 0;
            }), backgroundColor: "#3b82f6" }]
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } } }
        });
      }
    }
  </script>
</body>
</html>
