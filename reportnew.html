    let state = { type: 'จป.ว', area: 'PRINT', area5S: 'PRINT', responses: {}, images: {} };

    function init() { 
      populateDropdowns(); 
      buildChecklist(); 
      loadDraft(); 
      setupAutoSave(); 
      document.getElementById('safetyForm').addEventListener('submit', handleSubmit); 
    }

    function populateDropdowns() {
      const fillSelect = (id, filterBy, defaultVal) => {
        const sel = document.getElementById(id);
        sel.innerHTML = UNIFIED_AREAS.filter(a => !filterBy || a[filterBy]).map(a => `<option value="${a.value}" ${a.value===defaultVal?'selected':''}>${a.label}</option>`).join('');
      };
      fillSelect('areaSafetySelect', 'hasSafety', state.area);
      fillSelect('area5SSelect', 'has5S', state.area5S);
    }

    function handleAreaChange(val) { state.area = val; document.getElementById('areaSafetyVal').value = val; buildChecklist(); }
    function handle5SAreaChange(val) { state.area5S = val; document.getElementById('area5SVal').value = val; buildChecklist(); }

    function selectType(type, el) {
      state.type = type; 
      document.getElementById('inspectionType').value = type;
      
      // Reset All Classes
      document.querySelectorAll('.type-btn').forEach(b => {
        b.classList.remove('border-primary', 'bg-amber-50', 'text-amber-700', 'border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
        b.classList.add('border-slate-200', 'bg-slate-50', 'text-slate-500');
      });
      
      // Active Current
      el.classList.remove('border-slate-200', 'bg-slate-50', 'text-slate-500');
      const is5S = type === '5S';
      
      if (is5S) {
        el.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
        document.getElementById('areaSafety').classList.add('hidden');
        document.getElementById('area5S').classList.remove('hidden');
        state.area5S = "PRINT"; 
        document.getElementById('area5SSelect').value = "PRINT";
        document.getElementById('headerTitle').textContent = '5S INSPECTION SYSTEM';
        document.getElementById('headerSub').textContent = 'ระบบตรวจประเมิน 5ส ในพื้นที่';
      } else {
        el.classList.add('border-primary', 'bg-amber-50', 'text-amber-700');
        document.getElementById('areaSafety').classList.remove('hidden');
        document.getElementById('area5S').classList.add('hidden');
        state.area = "PRINT"; 
        document.getElementById('areaSafetySelect').value = "PRINT";
        document.getElementById('headerTitle').textContent = 'SAFETY PATROL SYSTEM';
        document.getElementById('headerSub').textContent = 'ระบบตรวจตราความปลอดภัยในพื้นที่';
      }
      populateDropdowns();
      buildChecklist();
    }

    function buildChecklist() {
      const container = document.getElementById('checklistContainer'); 
      container.innerHTML = ''; 
      state.responses = {}; 
      state.images = {};
      if (state.type === '5S') render5SChecklist(container); else renderSafetyChecklist(container);
    }

    function renderSafetyChecklist(container) {
      const checklist = getSafetyChecklist(state.area); 
      Object.entries(checklist).forEach(([sKey, section]) => {
        const sNum = sKey.replace('s', ''); 
        const card = document.createElement('div'); 
        card.className = 'bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 mb-5';
        
        let html = `<div class="inline-block bg-primary text-white px-3 py-1 rounded-full text-xs font-bold mb-3 tracking-wide">Safety Area</div>
                    <h3 class="font-bold text-slate-800 text-base mb-4 border-l-4 border-primary pl-3">${section.title}</h3>`;
        
        section.qs.forEach((q, i) => {
          const qKey = `s${sNum}_q${i}`; const isOptional = sKey === 's7' || sKey === 's8';
          const isWater = sKey === 's1' && q === 'Water Mist'; 
          const showWater = (state.area === 'PRINT' || state.area === 'LAMINATE') && isWater;
          
          if (showWater) {
            html += `
            <div class="check-item water-mist-block bg-white p-4 mb-3 rounded-xl border-2 border-slate-100 transition-all duration-300" id="item_${qKey}">
              <small class="block font-semibold text-slate-700 text-sm mb-3">${i+1}. ${q}</small>
              <div class="flex items-center gap-3 mb-3 flex-wrap bg-slate-50 p-3 rounded-xl border border-slate-200">
                <input type="number" step="any" id="water_val_${sNum}_${i}" placeholder="ระบุ %" class="w-24 px-3 py-2 rounded-lg border-2 border-slate-200 focus:border-primary outline-none transition text-sm" oninput="handleWaterMist(this.value,'${sNum}',${i})">
                <span class="font-bold text-slate-500">%</span>
                <span id="water_badge_${sNum}_${i}" class="hidden px-3 py-1 rounded-full text-xs font-bold"></span>
              </div>
              <input type="hidden" name="section${sNum}_q${i}" id="hidden_${qKey}">
              <textarea name="section${sNum}_remark${i}" placeholder="หมายเหตุ (ถ้ามี)" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 bg-slate-50 focus:bg-white focus:border-primary outline-none text-sm transition mt-2"></textarea>
              <div class="duedate-box hidden mt-3 bg-rose-50 p-3 rounded-xl border border-rose-200" id="dd_${qKey}">
                <label class="block text-xs font-bold text-rose-700 mb-1"><i class="fas fa-calendar-times"></i> วันที่ต้องแก้ไขเสร็จ (Due Date) *</label>
                <input type="date" name="section${sNum}_duedate${i}" class="w-full px-3 py-2 rounded-lg border-2 border-rose-200 bg-white focus:border-rose-400 outline-none text-sm text-slate-700">
              </div>
              ${photoUploadHTML(qKey)}
            </div>`;
          } else {
            html += `
            <div class="check-item bg-white p-4 mb-3 rounded-xl border-2 border-slate-100 transition-all duration-300" id="item_${qKey}">
              <small class="block font-semibold text-slate-700 text-sm mb-3">${i+1}. ${q} ${!isOptional ? '<span class="text-rose-500">*</span>' : ''}</small>
              <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                  <input type="radio" class="peer/good hidden" name="section${sNum}_q${i}" id="y_${qKey}" value="ดี" onchange="handleStatusChange('${qKey}', 'ดี')">
                  <label for="y_${qKey}" class="block cursor-pointer p-3 rounded-xl bg-slate-50 border-2 border-slate-200 text-center font-bold text-sm text-slate-500 transition-all hover:bg-slate-100 peer-checked/good:bg-emerald-50 peer-checked/good:border-emerald-500 peer-checked/good:text-emerald-700 shadow-sm"><i class="fas fa-check-circle mr-1"></i> ปกติ</label>
                </div>
                <div>
                  <input type="radio" class="peer/bad hidden" name="section${sNum}_q${i}" id="n_${qKey}" value="ไม่ดี" onchange="handleStatusChange('${qKey}', 'ไม่ดี')">
                  <label for="n_${qKey}" class="block cursor-pointer p-3 rounded-xl bg-slate-50 border-2 border-slate-200 text-center font-bold text-sm text-slate-500 transition-all hover:bg-slate-100 peer-checked/bad:bg-rose-50 peer-checked/bad:border-rose-500 peer-checked/bad:text-rose-700 shadow-sm"><i class="fas fa-exclamation-triangle mr-1"></i> ไม่ปกติ</label>
                </div>
              </div>
              <textarea name="section${sNum}_remark${i}" placeholder="หมายเหตุ (ถ้ามี)" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 bg-slate-50 focus:bg-white focus:border-primary outline-none text-sm transition"></textarea>
              <div class="duedate-box hidden mt-3 bg-rose-50 p-3 rounded-xl border border-rose-200" id="dd_${qKey}">
                <label class="block text-xs font-bold text-rose-700 mb-1"><i class="fas fa-calendar-times"></i> วันที่ต้องแก้ไขเสร็จ (Due Date) *</label>
                <input type="date" name="section${sNum}_duedate${i}" class="w-full px-3 py-2 rounded-lg border-2 border-rose-200 bg-white focus:border-rose-400 outline-none text-sm text-slate-700">
              </div>
              ${photoUploadHTML(qKey)}
            </div>`;
          }
        }); 
        card.innerHTML = html; 
        container.appendChild(card);
      });
    }

    function render5SChecklist(container) {
      const areaData = CHECKLIST_5S[state.area5S];
      if (!areaData || !areaData.sections || areaData.sections.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center shadow-sm border border-slate-200 text-slate-500"><i class="fas fa-info-circle fa-2x mb-3 text-emerald-500"></i><p class="font-bold text-slate-700">ยังไม่ได้กำหนดแบบประเมิน 5S</p><p class="text-sm">สำหรับพื้นที่: ${state.area5S}</p></div>`;
        return;
      }
      
      areaData.sections.forEach((sec, sIdx) => {
        const card = document.createElement('div'); 
        card.className = 'bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 mb-5';
        
        let html = `<div class="inline-block bg-emerald-500 text-white px-3 py-1 rounded-full text-xs font-bold mb-3 tracking-wide">5S Standard</div>
                    <h3 class="font-bold text-slate-800 text-base mb-4 border-l-4 border-emerald-500 pl-3">${sec.title}</h3>`;
        
        sec.qs.forEach((q, qIdx) => {
          const qKey = `5s_s${sIdx}_q${qIdx}`;
          html += `
          <div class="check-item bg-white p-4 mb-3 rounded-xl border-2 border-slate-100 transition-all duration-300" id="item_${qKey}">
            <small class="block font-semibold text-slate-700 text-sm mb-3">${qIdx+1}. ${q}</small>
            <div class="grid grid-cols-3 gap-2 mb-3">
              <div>
                <input type="radio" class="peer/good hidden" name="5s_s${sIdx}_q${qIdx}" id="g_${qKey}" value="ดี" onchange="handle5SStatusChange('${qKey}', 'ดี')">
                <label for="g_${qKey}" class="block cursor-pointer p-2.5 rounded-xl bg-slate-50 border-2 border-slate-200 text-center font-bold text-xs sm:text-sm text-slate-500 transition-all hover:bg-slate-100 peer-checked/good:bg-emerald-50 peer-checked/good:border-emerald-500 peer-checked/good:text-emerald-700 shadow-sm flex flex-col items-center gap-1"><i class="fas fa-check-circle text-lg"></i>ดี</label>
              </div>
              <div>
                <input type="radio" class="peer/fair hidden" name="5s_s${sIdx}_q${qIdx}" id="f_${qKey}" value="พอใช้" onchange="handle5SStatusChange('${qKey}', 'พอใช้')">
                <label for="f_${qKey}" class="block cursor-pointer p-2.5 rounded-xl bg-slate-50 border-2 border-slate-200 text-center font-bold text-xs sm:text-sm text-slate-500 transition-all hover:bg-slate-100 peer-checked/fair:bg-amber-50 peer-checked/fair:border-amber-500 peer-checked/fair:text-amber-700 shadow-sm flex flex-col items-center gap-1"><i class="fas fa-circle-half-stroke text-lg"></i>พอใช้</label>
              </div>
              <div>
                <input type="radio" class="peer/bad hidden" name="5s_s${sIdx}_q${qIdx}" id="p_${qKey}" value="ปรับปรุง" onchange="handle5SStatusChange('${qKey}', 'ปรับปรุง')">
                <label for="p_${qKey}" class="block cursor-pointer p-2.5 rounded-xl bg-slate-50 border-2 border-slate-200 text-center font-bold text-xs sm:text-sm text-slate-500 transition-all hover:bg-slate-100 peer-checked/bad:bg-rose-50 peer-checked/bad:border-rose-500 peer-checked/bad:text-rose-700 shadow-sm flex flex-col items-center gap-1"><i class="fas fa-wrench text-lg"></i>ปรับปรุง</label>
              </div>
            </div>
            <textarea name="5s_remark_s${sIdx}_q${qIdx}" placeholder="หมายเหตุ (ถ้ามี)" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 bg-slate-50 focus:bg-white focus:border-emerald-500 outline-none text-sm transition"></textarea>
            <div class="duedate-box hidden mt-3 bg-rose-50 p-3 rounded-xl border border-rose-200" id="dd_${qKey}">
              <label class="block text-xs font-bold text-rose-700 mb-1"><i class="fas fa-calendar-times"></i> วันที่ต้องแก้ไขเสร็จ (Due Date) *</label>
              <input type="date" name="5s_duedate_s${sIdx}_q${qIdx}" class="w-full px-3 py-2 rounded-lg border-2 border-rose-200 bg-white focus:border-rose-400 outline-none text-sm text-slate-700">
            </div>
            ${photoUploadHTML(qKey)}
          </div>`;
        });
        card.innerHTML = html; 
        container.appendChild(card);
      });
    }

    function photoUploadHTML(qKey) { 
      return `
      <div class="bg-slate-50 p-3 rounded-xl border-2 border-dashed border-slate-200 mt-3">
        <div id="preview_${qKey}" class="flex flex-wrap gap-2 mb-2 empty:mb-0"></div>
        <div class="flex gap-2">
          <button type="button" class="flex-1 py-2 bg-white border border-slate-200 rounded-lg text-slate-600 font-bold text-xs hover:border-primary hover:text-primary transition shadow-sm flex items-center justify-center gap-2" onclick="triggerInput('cam','${qKey}')"><i class="fas fa-camera"></i> ถ่ายรูป</button>
          <button type="button" class="flex-1 py-2 bg-white border border-slate-200 rounded-lg text-slate-600 font-bold text-xs hover:border-primary hover:text-primary transition shadow-sm flex items-center justify-center gap-2" onclick="triggerInput('gal','${qKey}')"><i class="fas fa-images"></i> อัลบั้ม</button>
        </div>
        <input type="file" id="cam_${qKey}" accept="image/*" capture="environment" class="hidden" onchange="handlePhoto(this,'${qKey}')">
        <input type="file" id="gal_${qKey}" accept="image/*" class="hidden" onchange="handlePhoto(this,'${qKey}')">
      </div>`; 
    }

    // Handlers
    function handleStatusChange(qKey, status) {
      const el = document.getElementById(`item_${qKey}`), remark = el.querySelector('textarea'), ddBox = document.getElementById(`dd_${qKey}`), ddInput = ddBox.querySelector('input');
      state.responses[qKey] = { status };
      if (status === 'ไม่ดี') { 
        el.classList.add('border-rose-300', 'bg-rose-50/30'); el.classList.remove('border-slate-100');
        remark.required = true; remark.placeholder = '* กรุณาระบุรายละเอียดปัญหา'; 
        ddBox.classList.remove('hidden'); ddInput.required = true; 
      } else { 
        el.classList.remove('border-rose-300', 'bg-rose-50/30'); el.classList.add('border-slate-100');
        remark.required = false; remark.placeholder = 'หมายเหตุ (ถ้ามี)'; 
        ddBox.classList.add('hidden'); ddInput.required = false; ddInput.value = ''; 
      }
    }

    function handle5SStatusChange(qKey, status) {
      const el = document.getElementById(`item_${qKey}`), remark = el.querySelector('textarea'), ddBox = document.getElementById(`dd_${qKey}`), ddInput = ddBox.querySelector('input');
      state.responses[qKey] = { status };
      if (status === "ปรับปรุง") { 
        el.classList.add('border-rose-300', 'bg-rose-50/30'); el.classList.remove('border-slate-100');
        remark.required = true; remark.placeholder = '* กรุณาระบุปัญหาที่ต้องแก้ไข'; 
        ddBox.classList.remove('hidden'); ddInput.required = true; 
      } else { 
        el.classList.remove('border-rose-300', 'bg-rose-50/30'); el.classList.add('border-slate-100');
        remark.required = false; remark.placeholder = 'หมายเหตุ (ถ้ามี)'; 
        ddBox.classList.add('hidden'); ddInput.required = false; ddInput.value = ''; 
      }
    }

    function handleWaterMist(val, sNum, i) {
      const qKey = `s${sNum}_q${i}`, badge = document.getElementById(`water_badge_${sNum}_${i}`), el = document.getElementById(`item_${qKey}`), remark = el.querySelector('textarea'), ddBox = document.getElementById(`dd_${qKey}`), ddInput = ddBox?.querySelector('input'), hidden = document.getElementById(`hidden_${qKey}`);
      if (!val) { badge.classList.add('hidden'); hidden.value=''; state.responses[qKey] = {}; return; }
      const num = parseFloat(val); badge.classList.remove('hidden');
      if (num < 50) { 
        badge.textContent = '⚠️ ไม่ปกติ'; badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-700 ml-2'; hidden.value = 'ไม่ดี'; state.responses[qKey] = { status: 'ไม่ดี', waterValue: num }; 
        remark.required = true; ddBox.classList.remove('hidden'); ddInput.required = true; 
        el.classList.add('border-rose-300', 'bg-rose-50/30');
      } else { 
        badge.textContent = '✅ ปกติ'; badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 ml-2'; hidden.value = 'ดี'; state.responses[qKey] = { status: 'ดี', waterValue: num }; 
        remark.required = false; ddBox.classList.add('hidden'); ddInput.required = false; ddInput.value = ''; 
        el.classList.remove('border-rose-300', 'bg-rose-50/30');
      }
    }

    // Photo Handlers
    function triggerInput(type, qKey) { document.getElementById(`${type}_${qKey}`).click(); }
    function handlePhoto(input, qKey) {
      if (!input.files[0]) return; if (!state.images[qKey]) state.images[qKey] = [];
      if (state.images[qKey].length >= CONFIG.MAX_IMAGES_PER_ITEM) { showToast('จำกัดสูงสุด 3 รูปต่อข้อ', 'error'); input.value = ''; return; }
      const reader = new FileReader(); reader.onload = e => {
        const img = new Image(); img.onload = () => {
          const canvas = document.createElement('canvas'); const scale = Math.min(CONFIG.IMAGE_MAX_WIDTH / img.width, CONFIG.IMAGE_MAX_WIDTH / img.height, 1);
          canvas.width = img.width * scale; canvas.height = img.height * scale; canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          state.images[qKey].push({ b64: canvas.toDataURL('image/jpeg', CONFIG.IMAGE_QUALITY), caption: '' }); renderPhotos(qKey); input.value = '';
        }; img.src = e.target.result; }; reader.readAsDataURL(input.files[0]);
    }
    function renderPhotos(qKey) { 
      const container = document.getElementById(`preview_${qKey}`); 
      container.innerHTML = (state.images[qKey] || []).map((img, idx) => `
        <div class="relative w-[30%] aspect-square rounded-lg overflow-hidden border-2 border-slate-200">
          <img src="${img.b64}" class="w-full h-full object-cover">
          <div class="absolute top-1 right-1 w-6 h-6 bg-rose-500 text-white rounded-full flex items-center justify-center cursor-pointer shadow-md text-xs border border-white" onclick="removePhoto('${qKey}', ${idx})"><i class="fas fa-times"></i></div>
          <input class="absolute bottom-0 left-0 w-full text-[10px] p-1 bg-white/90 border-t border-slate-200 outline-none text-slate-700" value="${escapeHtml(img.caption)}" placeholder="คำอธิบายภาพ.." onchange="updateCaption('${qKey}', ${idx}, this.value)">
        </div>`).join(''); 
    }
    function removePhoto(qKey, idx) { state.images[qKey].splice(idx, 1); renderPhotos(qKey); }
    function updateCaption(qKey, idx, val) { if (state.images[qKey][idx]) state.images[qKey][idx].caption = val; }

    // Validation & Submit
    function validate() {
      if (!document.getElementById('inspectorName').value.trim()) { showToast('กรุณาระบุชื่อผู้ตรวจสอบ', 'error'); return false; }
      let valid = true;
      document.querySelectorAll('.check-item').forEach(el => {
        el.classList.remove('border-rose-500', 'animate-shake'); 
        if (el.style.display === 'none') return; 
        const qKey = el.id.replace('item_', '');
        
        if (state.type === '5S') {
          const radios = el.querySelectorAll('input[type="radio"]');
          if (radios.length > 0) { 
            const checked = el.querySelector('input[type="radio"]:checked');
            if (!checked) { el.classList.add('border-rose-500', 'animate-shake'); valid = false; }
            else if (checked.value === 'ปรับปรุง') { 
              const remark = el.querySelector('textarea'), dueDate = el.querySelector('input[type="date"]'); 
              if (!remark.value.trim() || !dueDate.value) { el.classList.add('border-rose-500', 'animate-shake'); valid = false; } 
            } 
          }
        } else {
          const radios = el.querySelectorAll('input[type="radio"]');
          if (radios.length > 0) { 
            const checked = el.querySelector('input[type="radio"]:checked');
            if (!checked && !el.classList.contains('water-mist-block')) { el.classList.add('border-rose-500', 'animate-shake'); valid = false; }
            else if (checked?.value === 'ไม่ดี') { 
              if (!el.querySelector('textarea').value.trim() || !el.querySelector('input[type="date"]').value) { el.classList.add('border-rose-500', 'animate-shake'); valid = false; } 
            } 
          }
          if (el.classList.contains('water-mist-block')) {
            const wv = el.querySelector('input[type="number"]'); 
            if (!wv.value.trim()) { el.classList.add('border-rose-500', 'animate-shake'); valid = false; }
            else if (parseFloat(wv.value) < 50) { 
              if (!el.querySelector('textarea').value.trim() || !el.querySelector('input[type="date"]').value) { el.classList.add('border-rose-500', 'animate-shake'); valid = false; } 
            } 
          }
        }
      }); 
      if (!valid) { 
        const firstErr = document.querySelector('.border-rose-500'); 
        if (firstErr) {
          firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
          showToast('กรุณากรอกข้อมูลในข้อที่ไฮไลต์สีแดงให้ครบถ้วน', 'error');
        }
      } 
      return valid;
    }

    async function handleSubmit(e) { 
      e.preventDefault(); 
      if (!validate()) return; 
      document.getElementById('loader').classList.remove('hidden'); document.getElementById('loader').classList.add('flex');
      document.getElementById('submitBtn').disabled = true;
      try { 
        const res = await fetchWithRetry(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(buildPayload()) });
        if (res.status === 'success') { 
          showToast('✅ ส่งรายงานสำเร็จ', 'success'); 
          localStorage.removeItem(CONFIG.DRAFT_KEY); 
          setTimeout(() => window.location.href = 'DashNew.html', 1500); 
        } else throw new Error(res.message || 'Submission failed'); 
      } catch (err) { 
        showToast(`❌ ${err.message}`, 'error'); 
      } finally { 
        document.getElementById('loader').classList.add('hidden'); document.getElementById('loader').classList.remove('flex');
        document.getElementById('submitBtn').disabled = false; 
      }
    }

    function buildPayload() {
      const details = {}, images = {}, is5S = state.type === '5S', area = is5S ? state.area5S : state.area;
      Object.entries(state.responses).forEach(([qKey, resp]) => {
        if (!resp.status) return;
        const detailKey = qKey.startsWith('5s_') ? qKey : `section${qKey.replace('s', '')}`;
        details[detailKey] = resp.status;
        if ((is5S && resp.status === 'ปรับปรุง') || (!is5S && resp.status === 'ไม่ดี')) {
          details[`${detailKey}_remark`] = document.querySelector(`#item_${qKey} textarea`)?.value || '';
          details[`${detailKey}_duedate`] = document.querySelector(`#item_${qKey} input[type="date"]`)?.value || '';
        }
        if (resp.waterValue !== undefined) details.water_val = resp.waterValue;
      });
      
      Object.entries(state.images).forEach(([qKey, imgs]) => imgs.forEach((img, idx) => {
        let backendKey = qKey;
        if (qKey.startsWith('5s_s')) {
          const match = qKey.match(/5s_s(\d+)_q(\d+)/);
          if (match) backendKey = `5s_${match[1]}_${match[2]}`;
        }
        images[`${backendKey}_${idx}`] = img.b64;
        if (img.caption?.trim()) details[`caption_${backendKey}_${idx}`] = img.caption;
      }));
      
      const secRes = {};
      if (is5S) {
        const sections = (CHECKLIST_5S[state.area5S] || CHECKLIST_5S["OFFICE"])?.sections || [];
        sections.forEach((_, sIdx) => { secRes[`s${sIdx+1}_res`] = 'ดี'; });
      } else {
        const checklist = getSafetyChecklist(area);
        Object.keys(checklist).forEach(sKey => {
          const sNum = sKey.replace('s', ''); let hasBad = false;
          checklist[sKey].qs.forEach((_, qIdx) => { if (details[`section${sNum}_q${qIdx}`] === 'ไม่ดี') hasBad = true; });
          if (sKey === 's1' && (area === 'PRINT' || area === 'LAMINATE')) {
            const wv = parseFloat(details.water_val); if (!isNaN(wv) && wv < 50) hasBad = true;
          }
          secRes[`${sKey}_res`] = hasBad ? 'ไม่ดี' : 'ดี';
        });
      }
      
      return { inspector: document.getElementById('inspectorName').value.trim(), area, inspectionType: state.type, area5S: is5S ? area : null, images, details, ...secRes };
    }

    async function fetchWithRetry(url, options, retries = 3) { for (let i=0; i<retries; i++) { try { const res = await fetch(url, options); return await res.json(); } catch(e) { if(i===retries-1) throw e; await new Promise(r=>setTimeout(r, 1000*(i+1))); } } }

    function setupAutoSave() { setInterval(() => { localStorage.setItem(CONFIG.DRAFT_KEY, JSON.stringify({ type: state.type, area: state.area, area5S: state.area5S, inspector: document.getElementById('inspectorName').value, timestamp: Date.now() })); }, 30000); }
    function loadDraft() { const raw = localStorage.getItem(CONFIG.DRAFT_KEY); if (!raw) return; try { const d = JSON.parse(raw); if (Date.now() - d.timestamp < 86400000) { document.getElementById('inspectorName').value = d.inspector || ''; if (d.type) selectType(d.type, document.querySelector(`.type-btn[data-type="${d.type}"]`)); state.area = d.area || 'PRINT'; state.area5S = d.area5S || 'PRINT'; populateDropdowns(); buildChecklist(); showToast('📥 โหลดข้อมูลล่าสุดจากเครื่อง', 'success'); } } catch {} }
    function escapeHtml(t) { return t ? t.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) : ''; }
    
    function showToast(msg, type='info') { 
      const tContainer = document.getElementById('toastContainer');
      const t = document.createElement('div'); 
      const color = type === 'success' ? 'border-emerald-500 text-emerald-700' : 'border-rose-500 text-rose-700';
      const icon = type === 'success' ? 'fa-check-circle text-emerald-500' : 'fa-exclamation-circle text-rose-500';
      t.className = `bg-white px-5 py-3 rounded-xl shadow-lg border-l-4 ${color} flex items-center gap-3 font-semibold text-sm animate-slide-in pointer-events-auto`; 
      t.innerHTML = `<i class="fas ${icon} text-lg"></i><span>${msg}</span>`; 
      tContainer.appendChild(t); 
      setTimeout(() => { t.classList.remove('animate-slide-in'); t.classList.add('animate-slide-out'); setTimeout(()=>t.remove(), 300); }, 3000); 
    }
    
    init();
  </script>
</body>
</html>
