<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>รายงานการติดตามงานแก้ไข</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <script>
    const appColor = localStorage.getItem('appColor') || '#E65100';
    const appFont = localStorage.getItem('appFont') || "'Prompt', sans-serif";
    
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: appColor },
          fontFamily: { sans: [appFont], mono: ["'IBM Plex Mono'", 'monospace'] }
        }
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      body { font-family: theme('fontFamily.sans'); }
      .hide-scroll::-webkit-scrollbar { display: none; }
      .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    }
    
    /* Animations & Utilities */
    #loader { transition: opacity 0.3s; }
    #loader.hide { opacity: 0; pointer-events: none; }
    .spin-ring { border-top-color: theme('colors.primary'); animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast-box { opacity: 0; transform: translateX(-50%) translateY(20px); transition: all 0.3s; pointer-events: none; }
    .toast-box.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Print styling */
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      #mainTable th { background: #eee !important; color: #000 !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 lg:pb-6">

  <div id="loader" class="fixed inset-0 bg-white/90 flex flex-col items-center justify-center z-[9999] gap-3">
    <div class="w-10 h-10 border-4 border-slate-200 rounded-full spin-ring"></div>
    <div class="text-sm text-slate-500 font-medium">กำลังโหลดข้อมูล...</div>
  </div>

  <nav class="bg-slate-900 text-white p-3 md:px-6 sticky top-0 z-50 flex items-center justify-between shadow-md no-print">
    <div class="flex items-center gap-3 overflow-hidden">
      <button onclick="window.location.href='index.html'" class="w-9 h-9 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center shrink-0 transition">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="truncate">
        <h1 class="text-sm md:text-base font-semibold truncate tracking-wide" id="dynamicAppName">รายงานการติดตามงานแก้ไข</h1>
        <span class="text-[10px] md:text-xs text-primary block -mt-1 font-medium">Safety Patrol & 5S</span>
      </div>
    </div>
    <div class="flex gap-2 shrink-0">
      <button onclick="toggleSearch()" class="w-9 h-9 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center transition lg:hidden"><i class="fas fa-search"></i></button>
      <button onclick="exportExcel()" class="hidden md:flex w-9 h-9 rounded-lg bg-white/10 hover:bg-white/20 items-center justify-center transition" title="Export Excel"><i class="fas fa-file-excel"></i></button>
      <button onclick="window.print()" class="hidden md:flex w-9 h-9 rounded-lg bg-white/10 hover:bg-white/20 items-center justify-center transition" title="Print"><i class="fas fa-print"></i></button>
      <button onclick="window.location.href='admin.html'" class="w-9 h-9 rounded-lg bg-white/10 hover:bg-white/20 hidden lg:flex items-center justify-center transition" title="ตั้งค่าระบบ"><i class="fas fa-cog"></i></button>
    </div>
  </nav>

  <main class="max-w-[1400px] mx-auto p-3 md:p-6 space-y-4">

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden no-print">
      <button id="filterToggle" onclick="toggleFilter()" class="w-full p-3 md:p-4 bg-transparent border-none flex items-center justify-between cursor-pointer group">
        <div class="flex items-center gap-2">
          <i class="fas fa-sliders-h text-primary"></i>
          <h3 class="text-sm font-semibold text-slate-800">ตัวกรองข้อมูล</h3>
          <div id="activeTags" class="flex gap-1 flex-wrap ml-2"></div>
        </div>
        <i class="fas fa-chevron-down text-slate-400 text-xs transition-transform duration-300" id="filterArrow"></i>
      </button>
      
      <div id="filterBody" class="hidden p-4 border-t border-slate-100">
        <div class="flex gap-2 overflow-x-auto hide-scroll pb-2 mb-4">
          <button class="type-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold border-2 border-primary bg-primary/10 text-primary transition" data-type="all" onclick="setType('all',this)"><i class="fas fa-list mr-1"></i> ทั้งหมด</button>
          <button class="type-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold border-2 border-slate-200 text-slate-500 hover:border-primary hover:text-primary transition" data-type="จป.ว" onclick="setType('จป.ว',this)"><i class="fas fa-hard-hat mr-1"></i> จป.ว</button>
          <button class="type-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold border-2 border-slate-200 text-slate-500 hover:border-primary hover:text-primary transition" data-type="คปอ." onclick="setType('คปอ.',this)"><i class="fas fa-users-cog mr-1"></i> คปอ.</button>
          <button class="type-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold border-2 border-slate-200 text-slate-500 hover:border-primary hover:text-primary transition" data-type="Foreman/Mgr." onclick="setType('Foreman/Mgr.',this)"><i class="fas fa-user-tie mr-1"></i> Foreman</button>
          <button class="type-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold border-2 border-slate-200 text-slate-500 hover:border-blue-500 hover:text-blue-500 transition" data-type="Audit" onclick="setType('Audit',this)"><i class="fas fa-search mr-1"></i> Audit</button>
          <button class="type-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold border-2 border-slate-200 text-slate-500 hover:border-red-500 hover:text-red-500 transition" data-type="Accident/Fire" onclick="setType('Accident/Fire',this)"><i class="fas fa-fire-extinguisher mr-1"></i> Accident</button>
          <button class="type-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold border-2 border-slate-200 text-slate-500 hover:border-green-500 hover:text-green-500 transition" data-type="5S" onclick="setType('5S',this)"><i class="fas fa-broom mr-1"></i> 5S</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
          <div class="flex flex-col gap-1 relative md:col-span-1">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider"><i class="fas fa-search"></i> ค้นหา</label>
            <i class="fas fa-search absolute bottom-3 left-3 text-slate-400 text-xs"></i>
            <input type="text" id="searchFilter" placeholder="Job ID / ปัญหา..." oninput="debounceRender()" class="pl-8 p-2.5 text-sm border border-slate-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none w-full bg-slate-50 focus:bg-white transition">
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider"><i class="fas fa-calendar"></i> เดือน</label>
            <input type="month" id="monthFilter" onchange="loadReport()" class="p-2.5 text-sm border border-slate-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none w-full bg-slate-50 focus:bg-white transition">
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider"><i class="fas fa-map-marker-alt"></i> พื้นที่</label>
            <select id="areaFilter" onchange="render()" class="p-2.5 text-sm border border-slate-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none w-full bg-slate-50 focus:bg-white transition cursor-pointer">
              <option value="">-- ทั้งหมด --</option>
              <option value="PRINT">PRINT</option>
              <option value="LAMINATE">LAMINATE</option>
              <option value="SOLVENT">SOLVENT</option>
              <option value="REWINDER/SLITTER/PACKING">REWINDER/SLITTER/PACKING</option>
              <option value="BAG MAKING">BAG MAKING</option>
              <option value="QA&QC">QA&QC</option>
              <option value="WAREHOUSE">WAREHOUSE</option>
              <option value="OFFICE">OFFICE</option>
              <option value="CANTEEN">CANTEEN</option>
              <option value="ENGINEERING">ENGINEERING</option>
              <option value="OUTSIDE">OUTSIDE</option>
            </select>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider"><i class="fas fa-toggle-on"></i> สถานะ</label>
            <select id="statusFilter" onchange="render()" class="p-2.5 text-sm border border-slate-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none w-full bg-slate-50 focus:bg-white transition cursor-pointer">
              <option value="">-- ทั้งหมด --</option>
              <option value="Open">Open</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>
        
        <button onclick="clearFilters()" class="text-xs font-semibold px-4 py-2 border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-100 transition inline-flex items-center gap-1"><i class="fas fa-rotate-left"></i> ล้างค่า</button>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 md:px-5 flex items-center flex-wrap gap-4 md:gap-6 no-print">
      <div class="flex items-center gap-2"><span class="text-lg font-bold text-slate-800" id="sumTotal">0</span><span class="text-xs text-slate-500 font-medium">รายการ</span></div>
      <div class="w-px h-6 bg-slate-200 hidden md:block"></div>
      <div class="flex items-center gap-2"><span class="text-lg font-bold text-red-500" id="sumOpen">0</span><span class="text-xs text-slate-500 font-medium">Open</span></div>
      <div class="w-px h-6 bg-slate-200 hidden md:block"></div>
      <div class="flex items-center gap-2"><span class="text-lg font-bold text-green-500" id="sumClosed">0</span><span class="text-xs text-slate-500 font-medium">Closed</span></div>
      <div class="w-px h-6 bg-slate-200 hidden md:block"></div>
      <div class="text-xs font-medium text-slate-400" id="displayMonthLabel"></div>
      
      <div class="ml-auto flex gap-2">
        <button onclick="exportCSV()" class="px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-semibold text-slate-600 hover:border-primary hover:text-primary transition flex items-center gap-1"><i class="fas fa-file-csv"></i> CSV</button>
      </div>
    </div>

    <div class="hidden lg:block bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left whitespace-nowrap" id="mainTable">
          <thead class="bg-slate-900 text-slate-100 text-[10px] uppercase tracking-wider font-semibold">
            <tr>
              <th class="px-3 py-3 text-center">#</th>
              <th class="px-3 py-3">ประเภท</th>
              <th class="px-3 py-3 text-center">รูปก่อน</th>
              <th class="px-3 py-3 text-center">รูปหลัง / สถานะ</th>
              <th class="px-3 py-3 cursor-pointer hover:bg-slate-800 transition" onclick="sortBy('area')">พื้นที่ <i class="fas fa-sort opacity-50 ml-1"></i></th>
              <th class="px-3 py-3 cursor-pointer hover:bg-slate-800 transition" onclick="sortBy('jobId')">JOB NO. <i class="fas fa-sort opacity-50 ml-1"></i></th>
              <th class="px-3 py-3">ปัญหาที่พบ</th>
              <th class="px-3 py-3">แนวทางแก้ไข</th>
              <th class="px-3 py-3">ผู้รับผิดชอบ</th>
              <th class="px-3 py-3 cursor-pointer hover:bg-slate-800 transition" onclick="sortBy('dateFound')">พบ <i class="fas fa-sort opacity-50 ml-1"></i></th>
              <th class="px-3 py-3 cursor-pointer hover:bg-slate-800 transition" onclick="sortBy('dueDate')">ครบกำหนด <i class="fas fa-sort opacity-50 ml-1"></i></th>
              <th class="px-3 py-3 cursor-pointer hover:bg-slate-800 transition" onclick="sortBy('finishDate')">เสร็จสิ้น <i class="fas fa-sort opacity-50 ml-1"></i></th>
              <th class="px-3 py-3">หมายเหตุ</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 text-xs">
            </tbody>
        </table>
      </div>
    </div>

    <div id="cardList" class="lg:hidden flex flex-col gap-3">
      </div>

    <div id="pagination" class="flex flex-wrap justify-center items-center gap-1 py-4 no-print"></div>

  </main>

  <nav class="lg:hidden fixed bottom-0 left-0 right-0 h-[60px] bg-slate-900 border-t border-slate-800 flex justify-around items-center z-50 no-print pb-safe">
    <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary"><i class="fas fa-chart-pie text-lg"></i><span class="text-[10px] font-bold">แดชบอร์ด</span></a>
    <a href="check.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary"><i class="fas fa-clipboard-check text-lg"></i><span class="text-[10px] font-bold">ตรวจพื้นที่</span></a>
    <a href="report.html" class="flex flex-col items-center gap-1 text-primary"><i class="fas fa-list text-lg"></i><span class="text-[10px] font-bold">รายงาน</span></a>
    <a href="admin.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary"><i class="fas fa-cog text-lg"></i><span class="text-[10px] font-bold">ตั้งค่า</span></a>
  </nav>

  <div id="toastBox" class="toast-box fixed bottom-20 md:bottom-6 left-1/2 bg-slate-800 text-white px-5 py-2.5 rounded-full text-xs font-semibold flex items-center gap-2 z-[9999] shadow-lg whitespace-nowrap"></div>

  <script>
    // ── CONFIG ──
    const API = "https://script.google.com/macros/s/AKfycbwHIUI1ZbFYKeBK7_fkEI6_hfhhhDTxE0fjltus2i-TI7pvhM2CN1HaKDIy4cgXUNT5gQ/exec";
    const AREA_MAP = {"แผนก Print":"PRINT","แผนก Laminate":"LAMINATE","แผนก Solvent":"SOLVENT","แผนก Rewinder / Slitter / Packing":"REWINDER/SLITTER/PACKING","แผนก BAG MAKING":"BAG MAKING","แผนก QA & QC":"QA&QC","แผนก Warehouse":"WAREHOUSE","Office":"OFFICE","พื้นที่รอบบริเวณโรงงาน":"OUTSIDE","Canteen":"CANTEEN","EN":"ENGINEERING"};
    const PER_PAGE = 50;

    let allData = [];
    let currentType = "all";
    let currentPage = 1;
    let sortKey = "dateFound";
    let sortDir = "desc";
    let debTimer = null;
    let filterOpen = false; // ค่าเริ่มต้น ปิด Filter ไว้เพื่อความสะอาดตา

    // ── INIT ──
    document.addEventListener("DOMContentLoaded", () => {
      // Set App Name from Admin Settings
      const appName = localStorage.getItem('appName');
      if (appName) document.getElementById('dynamicAppName').textContent = appName;

      document.getElementById("monthFilter").value = new Date().toISOString().slice(0,7);
      
      // Auto open filter on desktop
      if(window.innerWidth > 768) toggleFilter();
      
      loadReport();
    });

    // ── LOAD ──
    async function loadReport() {
      showLoader(true);
      const m = document.getElementById("monthFilter").value;
      let url = `${API}?action=getReport`;
      
      if (m) {
        const d = new Date(m);
        const ms = d.toLocaleString("en-us", { month: "short", year: "numeric" });
        url += `&month=${encodeURIComponent(ms)}`;
        document.getElementById("displayMonthLabel").innerHTML = `<i class="fas fa-calendar-alt mr-1"></i> ${ms}`;
      } else {
        document.getElementById("displayMonthLabel").textContent = "ทั้งหมด";
      }

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const json = await res.json();
        allData = Array.isArray(json) ? json : [];
        currentPage = 1;
        render();
      } catch (err) {
        console.error(err);
        const errHtml = `<div class="text-center p-8 text-slate-500"><i class="fas fa-exclamation-triangle text-3xl mb-3 text-red-400"></i><p class="font-bold text-slate-700">โหลดข้อมูลไม่สำเร็จ</p><p class="text-xs mt-1 text-red-500">${esc(err.message)}</p><button onclick="loadReport()" class="mt-4 bg-slate-100 px-4 py-2 rounded-lg text-xs font-semibold hover:bg-slate-200 transition"><i class="fas fa-sync-alt mr-1"></i> ลองใหม่</button></div>`;
        document.getElementById("tableBody").innerHTML = `<tr><td colspan="13">${errHtml}</td></tr>`;
        document.getElementById("cardList").innerHTML = errHtml;
        showToast("โหลดไม่ได้: " + err.message, "e");
      } finally {
        showLoader(false);
      }
    }

    // ── FILTER & RENDER ──
    function render() {
      const search = document.getElementById("searchFilter").value.trim().toLowerCase();
      const area = document.getElementById("areaFilter").value;
      const status = document.getElementById("statusFilter").value;

      let list = [...allData];
      if (currentType !== "all") list = list.filter(d => d.inspectionType === currentType);
      if (area) list = list.filter(d => normArea(d.area) === area);
      if (status) list = list.filter(d => d.status === status);
      if (search) {
        list = list.filter(d =>
          (d.jobId || "").toLowerCase().includes(search) ||
          (d.problem || "").toLowerCase().includes(search) ||
          (d.remark || "").toLowerCase().includes(search) ||
          (d.picName || "").toLowerCase().includes(search) ||
          (d.inspector || "").toLowerCase().includes(search)
        );
      }

      list.sort((a, b) => cmp(a, b, sortKey, sortDir));

      // Summary
      document.getElementById("sumTotal").textContent = list.length;
      document.getElementById("sumOpen").textContent = list.filter(d => d.status === "Open").length;
      document.getElementById("sumClosed").textContent = list.filter(d => d.status === "Closed").length;

      const totalPages = Math.ceil(list.length / PER_PAGE);
      if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
      const pageData = list.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);

      const emptyHtml = `<div class="text-center p-12 text-slate-400"><i class="fas fa-folder-open text-4xl mb-3 opacity-30"></i><p class="font-semibold text-slate-600">ไม่พบข้อมูล</p><p class="text-xs mt-1">ลองปรับเงื่อนไขการค้นหาใหม่</p></div>`;

      if (!list.length) {
        document.getElementById("tableBody").innerHTML = `<tr><td colspan="13">${emptyHtml}</td></tr>`;
        document.getElementById("cardList").innerHTML = emptyHtml;
        document.getElementById("pagination").innerHTML = "";
        updateTags();
        return;
      }

      renderTable(pageData);
      renderCards(pageData);
      renderPagination(totalPages, list.length);
      updateTags();
    }

    function renderTable(pageData) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = pageData.map((item, i) => {
        const seq = (currentPage - 1) * PER_PAGE + i + 1;
        const isOpen = item.status === "Open";
        
        // รูปก่อน
        const imgB = item.picBefore && item.picBefore !== "-"
          ? `<img src="${driveThumb(item.picBefore)}" class="w-14 h-10 object-cover rounded border border-slate-200 cursor-pointer hover:scale-125 transition-transform origin-left mx-auto bg-slate-50" onclick="openImg('${esc(item.picBefore)}')">`
          : `<div class="w-14 h-10 border border-dashed border-slate-300 rounded flex items-center justify-center text-slate-300 text-xs mx-auto"><i class="fas fa-image"></i></div>`;
        
        // รูปหลัง หรือ ปุ่ม
        const imgA = item.picAfter && item.picAfter !== "-"
          ? `<img src="${driveThumb(item.picAfter)}" class="w-14 h-10 object-cover rounded border border-slate-200 cursor-pointer hover:scale-125 transition-transform origin-right mx-auto bg-slate-50" onclick="openImg('${esc(item.picAfter)}')">`
          : (isOpen ? `<a href="resolve.html?jobid=${encodeURIComponent(item.jobId)}" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1.5 rounded inline-flex items-center gap-1 text-[10px] font-semibold transition"><i class="fas fa-wrench"></i> ปิดงาน</a>` : `<span class="text-slate-300">-</span>`);
        
        const area = normArea(item.area);
        const dueStr = item.dueDate || "-";
        const isOver = isOpen && isDue(item.dueDate);
        const dueHtml = isOver ? `<span class="text-red-600 font-bold bg-red-50 px-1.5 py-0.5 rounded">${dueStr}</span>` : dueStr;

        const rowClass = isOpen ? 'border-l-4 border-l-red-500 bg-white hover:bg-slate-50' : 'border-l-4 border-l-green-500 bg-white hover:bg-slate-50';

        return `<tr class="${rowClass} transition">
          <td class="px-3 py-3 text-center text-slate-500 font-medium">${seq}</td>
          <td class="px-3 py-3">${typeBadge(item.inspectionType)}</td>
          <td class="px-3 py-3 text-center">${imgB}</td>
          <td class="px-3 py-3 text-center">${imgA}</td>
          <td class="px-3 py-3 font-semibold text-slate-700">${esc(area)}</td>
          <td class="px-3 py-3"><span class="font-mono text-blue-600 font-medium bg-blue-50 px-2 py-0.5 rounded">${esc(item.jobId || "-")}</span></td>
          <td class="px-3 py-3 max-w-[200px]">
            <div class="font-semibold text-slate-800 line-clamp-2 leading-snug">${esc(item.remark || item.problem || "-")}</div>
            ${item.problem && item.problem !== item.remark ? `<div class="text-[10px] text-slate-400 mt-1 truncate">${esc(item.problem)}</div>` : ""}
          </td>
          <td class="px-3 py-3 max-w-[150px] text-slate-600 line-clamp-2">${item.correctiveAction ? esc(item.correctiveAction) : `<span class="text-slate-300">-</span>`}</td>
          <td class="px-3 py-3 text-slate-600 truncate max-w-[100px]">${item.picName ? esc(item.picName) : `<span class="text-slate-300">-</span>`}</td>
          <td class="px-3 py-3 text-slate-500 whitespace-nowrap">${item.dateFound || "-"}</td>
          <td class="px-3 py-3 text-slate-500 whitespace-nowrap">${dueHtml}</td>
          <td class="px-3 py-3 whitespace-nowrap">${item.finishDate && item.finishDate !== "-" ? `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-bold"><i class="fas fa-check mr-1"></i>${esc(item.finishDate)}</span>` : `<span class="text-slate-300">-</span>`}</td>
          <td class="px-3 py-3 text-[10px] text-slate-500 max-w-[120px] truncate">${item.problemNote ? esc(item.problemNote) : `<span class="text-slate-300">-</span>`}</td>
        </tr>`;
      }).join("");
    }

    function renderCards(pageData) {
      const list = document.getElementById("cardList");
      list.innerHTML = pageData.map((item, i) => {
        const seq = (currentPage - 1) * PER_PAGE + i + 1;
        const isOpen = item.status === "Open";
        const area = normArea(item.area);
        
        const imgB = item.picBefore && item.picBefore !== "-"
          ? `<img src="${driveThumb(item.picBefore)}" class="w-16 h-12 object-cover rounded-md border border-slate-200 bg-slate-50" onclick="openImg('${esc(item.picBefore)}')">`
          : `<div class="w-16 h-12 border border-dashed border-slate-300 rounded-md flex items-center justify-center text-slate-300 text-sm"><i class="fas fa-image"></i></div>`;
          
        const imgA = item.picAfter && item.picAfter !== "-"
          ? `<img src="${driveThumb(item.picAfter)}" class="w-16 h-12 object-cover rounded-md border border-slate-200 bg-slate-50" onclick="openImg('${esc(item.picAfter)}')">`
          : `<div class="w-16 h-12 border ${isOpen ? 'border-red-200 text-red-300 bg-red-50' : 'border-dashed border-slate-300 text-slate-300'} rounded-md flex items-center justify-center text-sm"><i class="fas fa-camera"></i></div>`;
        
        const dueStr = item.dueDate || "-";
        const isOver = isOpen && isDue(item.dueDate);
        
        const statusBadge = isOpen 
          ? `<span class="bg-red-100 text-red-700 border border-red-200 px-2.5 py-0.5 rounded-full text-[10px] font-bold shadow-sm">⏳ Open</span>`
          : `<span class="bg-green-100 text-green-700 border border-green-200 px-2.5 py-0.5 rounded-full text-[10px] font-bold shadow-sm">✓ Closed</span>`;

        const fixBtn = isOpen
          ? `<a href="resolve.html?jobid=${encodeURIComponent(item.jobId)}" class="bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm inline-flex items-center gap-1"><i class="fas fa-wrench"></i> ปิดงาน</a>`
          : `<span class="text-green-600 text-xs font-bold"><i class="fas fa-check-circle mr-1"></i>แก้ไขแล้ว</span>`;

        return `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
          ${isOpen ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-red-500"></div>' : '<div class="absolute left-0 top-0 bottom-0 w-1 bg-green-500"></div>'}
          
          <div class="p-3 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 pl-4">
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold text-slate-400">#${seq}</span>
              <span class="font-mono text-[11px] font-semibold text-blue-600 bg-blue-100/50 px-1.5 rounded">${esc(item.jobId || "-")}</span>
              ${typeBadge(item.inspectionType)}
            </div>
            ${statusBadge}
          </div>
          
          <div class="p-3 flex gap-3 pl-4">
            <div class="flex gap-1.5 shrink-0">${imgB}${imgA}</div>
            <div class="flex-1 min-w-0">
              <div class="inline-block bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[9px] font-bold mb-1">${esc(area)}</div>
              <p class="text-sm font-bold text-slate-800 leading-tight mb-2 line-clamp-2">${esc(item.remark || item.problem || "-")}</p>
              
              <div class="flex flex-wrap gap-x-3 gap-y-1 text-[10px] text-slate-500">
                ${item.picName ? `<div class="flex items-center gap-1"><i class="fas fa-user text-slate-400"></i> ${esc(item.picName)}</div>` : ''}
                <div class="flex items-center gap-1"><i class="fas fa-calendar-plus text-slate-400"></i> ${item.dateFound || "-"}</div>
                <div class="flex items-center gap-1 ${isOver ? 'text-red-600 font-bold bg-red-50 px-1 rounded' : ''}"><i class="fas fa-clock ${isOver ? 'text-red-500' : 'text-slate-400'}"></i> ครบ ${dueStr}</div>
              </div>
            </div>
          </div>
          
          <div class="p-3 border-t border-slate-100 bg-slate-50 flex items-center justify-between pl-4">
            <div class="text-[11px] text-slate-500 flex-1 truncate pr-3">
              ${item.correctiveAction ? `<span class="text-slate-700 font-medium"><i class="fas fa-tools text-slate-400 mr-1"></i> ${esc(item.correctiveAction)}</span>` : `<span class="opacity-60 italic">ยังไม่มีแนวทางแก้ไข</span>`}
            </div>
            <div class="shrink-0">${fixBtn}</div>
          </div>
        </div>`;
      }).join("");
    }

    function renderPagination(totalPages, total) {
      const pagi = document.getElementById("pagination");
      if (totalPages <= 1) { pagi.innerHTML = `<span class="text-xs text-slate-400">แสดง ${total} รายการ</span>`; return; }
      
      let html = `<button onclick="goPage(1)" class="w-8 h-8 flex items-center justify-center rounded border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-50" ${currentPage===1?"disabled":""}>&laquo;</button>`;
      html += `<button onclick="goPage(${currentPage-1})" class="w-8 h-8 flex items-center justify-center rounded border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-50" ${currentPage===1?"disabled":""}>&lsaquo;</button>`;
      
      const s = Math.max(1, currentPage - 2);
      const e = Math.min(totalPages, currentPage + 2);
      
      for (let p = s; p <= e; p++) {
        if(p === currentPage) {
          html += `<button class="w-8 h-8 flex items-center justify-center rounded bg-primary text-white font-bold border border-primary">${p}</button>`;
        } else {
          html += `<button onclick="goPage(${p})" class="w-8 h-8 flex items-center justify-center rounded border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 hover:text-primary transition">${p}</button>`;
        }
      }
      
      html += `<button onclick="goPage(${currentPage+1})" class="w-8 h-8 flex items-center justify-center rounded border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-50" ${currentPage===totalPages?"disabled":""}>&rsaquo;</button>`;
      html += `<button onclick="goPage(${totalPages})" class="w-8 h-8 flex items-center justify-center rounded border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-50" ${currentPage===totalPages?"disabled":""}>&raquo;</button>`;
      html += `<span class="text-xs text-slate-400 ml-2">หน้า ${currentPage}/${totalPages} &middot; ${total} รายการ</span>`;
      
      pagi.innerHTML = html;
    }

    function goPage(p) { 
      currentPage = p; 
      render(); 
      window.scrollTo({top: 0, behavior: "smooth"}); 
    }

    // ── FILTERS ──
    function setType(type, el) {
      currentType = type;
      // Reset chips
      document.querySelectorAll(".type-chip").forEach(c => {
        c.classList.remove("border-primary", "bg-primary/10", "text-primary", "border-green-500", "bg-green-50", "text-green-600", "border-blue-500", "bg-blue-50", "text-blue-600", "border-red-500", "bg-red-50", "text-red-600");
        c.classList.add("border-slate-200", "text-slate-500");
      });
      
      // Apply active style
      el.classList.remove("border-slate-200", "text-slate-500");
      if(type === '5S') el.classList.add("border-green-500", "bg-green-50", "text-green-600");
      else if(type === 'Audit') el.classList.add("border-blue-500", "bg-blue-50", "text-blue-600");
      else if(type === 'Accident/Fire') el.classList.add("border-red-500", "bg-red-50", "text-red-600");
      else el.classList.add("border-primary", "bg-primary/10", "text-primary");

      currentPage = 1; 
      render();
    }

    function clearFilters() {
      setType("all", document.querySelector('.type-chip[data-type="all"]'));
      document.getElementById("areaFilter").value = "";
      document.getElementById("statusFilter").value = "";
      document.getElementById("searchFilter").value = "";
      document.getElementById("monthFilter").value = new Date().toISOString().slice(0,7);
      sortKey = "dateFound"; sortDir = "desc";
      currentPage = 1; 
      loadReport();
    }

    function debounceRender() { clearTimeout(debTimer); debTimer = setTimeout(() => { currentPage = 1; render(); }, 300); }

    function toggleFilter() {
      filterOpen = !filterOpen;
      const body = document.getElementById("filterBody");
      const arrow = document.getElementById("filterArrow");
      if (filterOpen) {
        body.classList.remove("hidden");
        arrow.classList.add("rotate-180");
      } else {
        body.classList.add("hidden");
        arrow.classList.remove("rotate-180");
      }
    }

    function toggleSearch() {
      if(!filterOpen) toggleFilter();
      setTimeout(() => document.getElementById("searchFilter").focus(), 100);
    }

    function updateTags() {
      const tags = [];
      if (currentType !== "all") tags.push(tagHtml("ประเภท: " + currentType, "clearType()"));
      if (document.getElementById("areaFilter").value) tags.push(tagHtml("พื้นที่: " + document.getElementById("areaFilter").value, "clearArea()"));
      if (document.getElementById("statusFilter").value) tags.push(tagHtml("สถานะ: " + document.getElementById("statusFilter").value, "clearStatus()"));
      if (document.getElementById("searchFilter").value.trim()) tags.push(tagHtml('"' + document.getElementById("searchFilter").value + '"', "clearSearch()"));
      document.getElementById("activeTags").innerHTML = tags.join("");
    }
    
    function tagHtml(txt, fn) { 
      return `<span class="bg-slate-800 text-white px-2 py-0.5 rounded text-[10px] flex items-center gap-1">${esc(txt)}<button onclick="${fn}" class="hover:text-red-400 focus:outline-none"><i class="fas fa-times"></i></button></span>`; 
    }
    function clearType() { setType("all", document.querySelector('.type-chip[data-type="all"]')); }
    function clearArea() { document.getElementById("areaFilter").value = ""; render(); }
    function clearStatus() { document.getElementById("statusFilter").value = ""; render(); }
    function clearSearch() { document.getElementById("searchFilter").value = ""; render(); }

    // ── SORT ──
    function sortBy(key) {
      if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortKey = key; sortDir = (key === "dateFound" || key === "dueDate" || key === "finishDate") ? "desc" : "asc"; }
      currentPage = 1; 
      render();
    }
    
    function cmp(a, b, key, dir) {
      let va, vb;
      if (key === "dateFound" || key === "dueDate" || key === "finishDate") { va = parseDt(a[key]); vb = parseDt(b[key]); }
      else if (key === "jobId") { va = parseInt((a.jobId || "").split("-").pop()) || 0; vb = parseInt((b.jobId || "").split("-").pop()) || 0; }
      else { va = (a[key] || "").toLowerCase(); vb = (b[key] || "").toLowerCase(); }
      const r = va > vb ? 1 : va < vb ? -1 : 0;
      return dir === "desc" ? -r : r;
    }
    
    function parseDt(s) {
      if (!s || s === "-") return 0;
      const p = s.split("/");
      if (p.length === 3) return new Date(+p[2], +p[1] - 1, +p[0]).getTime();
      const d = new Date(s); return isNaN(d) ? 0 : d.getTime();
    }
    
    function isDue(s) {
      if (!s || s === "-") return false;
      const t = parseDt(s);
      return t > 0 && t < Date.now();
    }

    // ── UTILS ──
    function normArea(a) { return AREA_MAP[a] || String(a || "").toUpperCase().trim() || "-"; }
    function driveThumb(url) {
      if (!url || url === "-") return "";
      const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w300` : url;
    }
    
    function typeBadge(t) {
      if (!t) return `<span class="text-slate-300">-</span>`;
      if (t === "5S") return `<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full text-[10px] font-bold"><i class="fas fa-broom mr-1"></i> 5S</span>`;
      if (t === "Audit") return `<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-[10px] font-bold"><i class="fas fa-search mr-1"></i> Audit</span>`;
      if (t === "Accident/Fire") return `<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded-full text-[10px] font-bold"><i class="fas fa-fire-extinguisher mr-1"></i> Accident</span>`;
      return `<span class="bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full text-[10px] font-bold"><i class="fas fa-shield-halved mr-1"></i> ${esc(t)}</span>`;
    }
    
    function openImg(url) { window.open(url, "_blank"); }
    function esc(s) { return String(s || "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
    
    function showLoader(v) { 
      const e = document.getElementById("loader"); 
      v ? e.classList.remove("hide") : e.classList.add("hide"); 
    }
    
    function showToast(msg, type = "i") {
      const b = document.getElementById("toastBox");
      const icon = type === "s" ? '<i class="fas fa-check-circle text-green-400"></i> ' : type === "e" ? '<i class="fas fa-times-circle text-red-400"></i> ' : '<i class="fas fa-info-circle text-blue-400"></i> ';
      b.innerHTML = icon + msg;
      b.classList.add("show");
      setTimeout(() => b.classList.remove("show"), 3000);
    }

    // ── EXPORT ──
    function exportCSV() {
      if (!allData.length) { showToast("ไม่มีข้อมูลให้ Export", "e"); return; }
      const hdr = ["ลำดับ", "ประเภท", "พื้นที่", "JOB NO.", "ปัญหา", "แนวทางแก้ไข", "ผู้รับผิดชอบ", "วันที่พบ", "ครบกำหนด", "เสร็จสิ้น", "สถานะ"];
      const rows = allData.map((d, i) => [i + 1, d.inspectionType, normArea(d.area), d.jobId, (d.remark || d.problem || "").slice(0, 100), (d.correctiveAction || "").slice(0, 100), d.picName || "", d.dateFound || "", d.dueDate || "", d.finishDate || "", d.status]);
      const csv = [hdr, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
      dl(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" }), "safety-report-" + new Date().toISOString().slice(0, 10) + ".csv");
      showToast("ดาวน์โหลด CSV เรียบร้อย", "s");
    }
    
    function exportExcel() {
      if (!allData.length) { showToast("ไม่มีข้อมูลให้ Export", "e"); return; }
      const tbl = document.createElement("table");
      const hdr = ["ลำดับ", "ประเภท", "พื้นที่", "JOB NO.", "ปัญหา", "แนวทางแก้ไข", "ผู้รับผิดชอบ", "วันที่พบ", "ครบกำหนด", "เสร็จสิ้น", "สถานะ"];
      tbl.innerHTML = `<thead><tr>${hdr.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${allData.map((d, i) => `<tr><td>${i + 1}</td><td>${esc(d.inspectionType)}</td><td>${esc(normArea(d.area))}</td><td>${esc(d.jobId)}</td><td>${esc((d.remark || d.problem || "").slice(0, 100))}</td><td>${esc((d.correctiveAction || "").slice(0, 100))}</td><td>${esc(d.picName || "")}</td><td>${esc(d.dateFound || "")}</td><td>${esc(d.dueDate || "")}</td><td>${esc(d.finishDate || "")}</td><td>${esc(d.status)}</td></tr>`).join("")}</tbody>`;
      const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>${tbl.outerHTML}</body></html>`;
      dl(new Blob([html], { type: "application/vnd.ms-excel" }), "safety-report-" + new Date().toISOString().slice(0, 10) + ".xls");
      showToast("ดาวน์โหลด Excel เรียบร้อย", "s");
    }
    
    function dl(blob, name) { 
      const a = document.createElement("a"); 
      a.href = URL.createObjectURL(blob); 
      a.download = name; 
      a.click(); 
      URL.revokeObjectURL(a.href); 
    }
  </script>
</body>
</html>
