<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAFETY PATROL REPORT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .type-btn.active { border-color: #003566 !important; background-color: #e6f0fa !important; color: #003566 !important; }
    @media (max-width: 767px) {
      .responsive-table thead { display: none; }
      .responsive-table tbody, .responsive-table tr, .responsive-table td { display: block; width: 100%; }
      .responsive-table tr { margin-bottom: 1rem; border: 1px solid #e2e8f0; border-radius: 0.75rem; background: #fff; padding: 0.5rem; }
      .responsive-table td { display: flex; flex-direction: row; justify-content: space-between; padding: 0.25rem 0.5rem; border: none; }
      .responsive-table td::before { content: attr(data-label); font-weight: 700; color: #64748b; font-size: 0.75rem; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 p-2 md:p-6 min-h-screen">

  <nav class="bg-[#003566] text-white fixed top-0 left-0 right-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between py-3">
      <div class="flex items-center gap-2 font-bold"><i class="fas fa-shield-halved text-sky-400"></i> TOPPAN SAFETY & 5S</div>
      <div class="flex items-center gap-4 text-xs md:text-sm">
        <a href="DashNew.html" class="hover:text-sky-300"><i class="fas fa-list-check"></i> รายการ</a>
        <a href="reportnew.html" class="text-sky-300 font-bold"><i class="fas fa-business-time"></i> Action Plan</a>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto mt-16 space-y-4">
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <h3 class="font-bold text-sm mb-3 flex items-center gap-2"><i class="fas fa-filter text-[#003566]"></i> ตัวกรองข้อมูล</h3>
      
      <div class="grid grid-cols-4 sm:grid-cols-7 gap-1.5 mb-4">
        <div class="type-btn p-2 rounded-lg border text-center cursor-pointer font-bold text-[10px] active shadow-sm" data-type="all" onclick="selectTypeFilter('all', this)">ทั้งหมด</div>
        <div class="type-btn p-2 rounded-lg border text-center cursor-pointer font-bold text-[10px] shadow-sm" data-type="จป.ว" onclick="selectTypeFilter('จป.ว', this)">จป.ว</div>
        <div class="type-btn p-2 rounded-lg border text-center cursor-pointer font-bold text-[10px] shadow-sm" data-type="คปอ." onclick="selectTypeFilter('คปอ.', this)">คปอ.</div>
        <div class="type-btn p-2 rounded-lg border text-center cursor-pointer font-bold text-[10px] shadow-sm" data-type="Foreman/Mgr." onclick="selectTypeFilter('Foreman/Mgr.', this)">Foreman</div>
        <div class="type-btn p-2 rounded-lg border text-center cursor-pointer font-bold text-[10px] shadow-sm" data-type="Audit" onclick="selectTypeFilter('Audit', this)">Audit</div>
        <div class="type-btn p-2 rounded-lg border text-center cursor-pointer font-bold text-[10px] shadow-sm" data-type="Accident/Fire" onclick="selectTypeFilter('Accident/Fire', this)">Accident</div>
        <div class="type-btn p-2 rounded-lg border text-center cursor-pointer font-bold text-[10px] shadow-sm" data-type="5S" onclick="selectTypeFilter('5S', this)">5S</div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div>
          <label class="text-[10px] font-bold text-slate-500">พื้นที่/แผนก</label>
          <select id="areaFilter" onchange="renderTable()" class="w-full p-2 text-xs border rounded-lg bg-slate-50">
            <option value="">-- ทั้งหมด --</option>
            <option value="PRINT">PRINT</option><option value="LAMINATE">LAMINATE</option>
            <option value="SOVENTLESS">SOVENTLESS</option><option value="QA&QC">QA & QC</option>
            <option value="WAREHOUSE">WAREHOUSE</option><option value="OFFICE">OFFICE</option>
            <option value="CANTEEN">CANTEEN</option><option value="TOILET">TOILET</option>
            <option value="LOCKER">LOCKER</option><option value="ENGINEERING">ENGINEERING</option>
            <option value="OUTSIDE">OUTSIDE</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-500">สถานะ</label>
          <select id="statusFilter" onchange="renderTable()" class="w-full p-2 text-xs border rounded-lg bg-slate-50">
            <option value="">-- ทั้งหมด --</option>
            <option value="Open">Open</option><option value="Closed">Closed</option>
          </select>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <table class="responsive-table w-full text-xs text-left">
        <thead>
          <tr class="bg-slate-100 text-slate-600">
            <th class="p-2">Job No.</th><th class="p-2">พื้นที่</th><th class="p-2">ปัญหา</th><th class="p-2">สถานะ</th>
          </tr>
        </thead>
        <tbody id="reportContent" class="divide-y"></tbody>
      </table>
    </div>
  </div>

  <script>
    const CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycbwHIUI1ZbFYKeBK7_fkEI6_hfhhhDTxE0fjltus2i-TI7pvhM2CN1HaKDIy4cgXUNT5gQ/exec" };
    let allReportData = []; let currentTypeFilter = 'all';

    window.onload = loadReport;

    async function loadReport() {
      try {
        const res = await fetch(CONFIG.API_URL + "?action=getReport");
        allReportData = await res.json();
        renderTable();
      } catch(e) { console.error(e); }
    }

    function selectTypeFilter(type, el) {
      currentTypeFilter = type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active')); 
      el.classList.add('active');
      renderTable();
    }

    function renderTable() {
      const areaVal = document.getElementById('areaFilter').value;
      const statusVal = document.getElementById('statusFilter').value;
      let filtered = allReportData.filter(item => 
        (currentTypeFilter === 'all' || item.inspectionType === currentTypeFilter) &&
        (areaVal === "" || item.area === areaVal) &&
        (statusVal === "" || item.status === statusVal)
      );
      
      document.getElementById('reportContent').innerHTML = filtered.map(item => `
        <tr>
          <td data-label="Job No.">${item.jobId}</td>
          <td data-label="พื้นที่">${item.area}</td>
          <td data-label="ปัญหา">${item.problem}</td>
          <td data-label="สถานะ">${item.status}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
