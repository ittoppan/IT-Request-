<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAFETY PATROL & 5S INSPECTION SYSTEM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    .needs-attention { border-color: #f43f5e !important; background-color: #fff1f2 !important; }
    .error { border-color: #ef4444 !important; background-color: #fef2f2 !important; animation: shake 0.3s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

  <div id="loader" class="fixed inset-0 bg-white/95 backdrop-blur-sm hidden flex-col items-center justify-center z-[2000]">
    <i class="fas fa-circle-notch text-4xl text-[#003566] animate-spin"></i>
    <p class="mt-4 font-semibold text-lg text-[#003566]">กำลังบันทึกข้อมูล...</p>
  </div>

  <nav class="bg-[#003566] text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-4 flex flex-wrap items-center justify-between py-3 gap-3">
      <div class="flex items-center gap-2">
        <i class="fas fa-shield-halved text-xl text-sky-400"></i>
        <span class="font-bold tracking-wide text-sm md:text-base">TOPPAN SAFETY & 5S</span>
      </div>
      <div class="flex items-center gap-2 overflow-x-auto text-xs md:text-sm">
        <a href="DashNew.html" class="px-3 py-1.5 rounded hover:bg-white/10 transition flex items-center gap-1"><i class="fas fa-list-check"></i> รายการตรวจ</a>
        <a href="dashboard.html" class="px-3 py-1.5 rounded hover:bg-white/10 transition flex items-center gap-1"><i class="fas fa-chart-pie"></i> ศูนย์ควบคุม</a>
        <a href="reportnew.html" class="px-3 py-1.5 rounded hover:bg-white/10 transition flex items-center gap-1"><i class="fas fa-business-time"></i> Action Plan</a>
        <a href="safety.html" class="px-3 py-1.5 bg-sky-600 rounded font-semibold flex items-center gap-1"><i class="fas fa-plus-circle"></i> ตรวจพื้นที่</a>
      </div>
    </div>
  </nav>

  <div class="bg-gradient-to-r from-[#002548] to-[#004080] text-white py-6 px-4 text-center shadow-inner">
    <h2 id="headerTitle" class="text-xl md:text-2xl font-bold">SAFETY PATROL & 5S INSPECTION SYSTEM</h2>
    <p id="headerSub" class="text-xs md:text-sm opacity-80 mt-1">ระบบตรวจตราความปลอดภัยและตรวจประเมิน 5ส</p>
  </div>

  <div class="max-w-xl mx-auto mt-6 px-4">
    <form id="safetyForm" class="space-y-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <label class="font-semibold text-sm text-slate-700 block mb-3"><i class="fas fa-clipboard-check text-[#003566] mr-1"></i> ประเภทการตรวจสอบ</label>
        
        <div class="grid grid-cols-3 gap-2 mb-4" id="typeSelector">
          <div class="type-btn p-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-center cursor-pointer hover:border-[#003566] transition flex flex-col items-center gap-1 font-semibold text-xs text-slate-600 active shadow-sm" data-type="จป.ว" onclick="selectType('จป.ว', this)"><i class="fas fa-hard-hat text-base text-slate-400"></i>จป.ว</div>
          <div class="type-btn p-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-center cursor-pointer hover:border-[#003566] transition flex flex-col items-center gap-1 font-semibold text-xs text-slate-600 shadow-sm" data-type="คปอ." onclick="selectType('คปอ.', this)"><i class="fas fa-users-cog text-base text-slate-400"></i>คปอ.</div>
          <div class="type-btn p-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-center cursor-pointer hover:border-[#003566] transition flex flex-col items-center gap-1 font-semibold text-xs text-slate-600 shadow-sm" data-type="Foreman/Mgr." onclick="selectType('Foreman/Mgr.', this)"><i class="fas fa-user-tie text-base text-slate-400"></i>Foreman/Mgr.</div>
          <div class="type-btn p-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-center cursor-pointer hover:border-[#003566] transition flex flex-col items-center gap-1 font-semibold text-xs text-slate-600 shadow-sm" data-type="Audit" onclick="selectType('Audit', this)"><i class="fas fa-search text-base text-slate-400"></i>Audit</div>
          <div class="type-btn p-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-center cursor-pointer hover:border-[#003566] transition flex flex-col items-center gap-1 font-semibold text-xs text-slate-600 shadow-sm" data-type="Accident/Fire" onclick="selectType('Accident/Fire', this)"><i class="fas fa-fire-extinguisher text-base text-slate-400"></i>Accident/Fire</div>
          <div class="type-btn p-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-center cursor-pointer hover:border-[#003566] transition flex flex-col items-center gap-1 font-semibold text-xs text-slate-600 shadow-sm" data-type="5S" onclick="selectType('5S', this)"><i class="fas fa-broom text-base text-slate-400"></i>5S</div>
        </div>
        <input type="hidden" id="inspectionType" value="จป.ว">

        <div id="areaSafety" class="mt-3">
          <label class="font-semibold text-sm text-slate-700 block mb-1.5"><i class="fas fa-map-marker-alt text-rose-500 mr-1"></i> พื้นที่สำรวจ</label>
          <select id="areaSafetySelect" class="w-full p-2.5 rounded-lg border border-slate-300 bg-slate-50 text-sm focus:ring-2 focus:ring-sky-500/20 focus:border-[#003566] transition outline-none" onchange="handleAreaChange(this.value)"></select>
          <input type="hidden" id="areaSafetyVal" value="PRINT">
        </div>

        <div id="area5S" class="mt-3 hidden">
          <label class="font-semibold text-sm text-slate-700 block mb-1.5"><i class="fas fa-broom text-emerald-600 mr-1"></i> พื้นที่ 5S</label>
          <select id="area5SSelect" class="w-full p-2.5 rounded-lg border border-slate-300 bg-slate-50 text-sm focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition outline-none" onchange="handle5SAreaChange(this.value)"></select>
          <input type="hidden" id="area5SVal" value="PRINT">
        </div>

        <div class="mt-4">
          <label class="font-semibold text-sm text-slate-700 block mb-1.5"><i class="fas fa-user-edit text-[#003566] mr-1"></i> ชื่อผู้ตรวจสอบ</label>
          <input type="text" id="inspectorName" placeholder="ระบุชื่อ-นามสกุล" class="w-full p-2.5 rounded-lg border border-slate-300 bg-slate-50 text-sm focus:ring-2 focus:ring-sky-500/20 focus:border-[#003566] transition outline-none" required>
        </div>
      </div>

      <div id="checklistContainer" class="space-y-4"></div>

      <button type="submit" class="w-full bg-gradient-to-r from-[#003566] to-[#00509d] text-white p-4 rounded-xl font-bold shadow-lg hover:shadow-xl hover:opacity-95 transition-all flex items-center justify-center gap-2" id="submitBtn">
        <i class="fas fa-paper-plane"></i> ส่งรายงานตรวจสอบ
      </button>
    </form>
  </div>

  <script>

    activeStyles.textContent = `

      .type-btn.active i { color: #003566 !important; transform: scale(1.1); }
      .type-btn.active-5s { background: #ecfdf5 !important; color: #059669 !important; border-color: #059669 !important; }
      .type-btn.active-5s i { color: #059669 !important; }
    `;
    document.head.appendChild(activeStyles);

    const CONFIG = {
      API_URL: "https://script.google.com/macros/s/AKfycbwHIUI1ZbFYKeBK7_fkEI6_hfhhhDTxE0fjltus2i-TI7pvhM2CN1HaKDIy4cgXUNT5gQ/exec",
      MAX_IMAGES_PER_ITEM: 3,
      IMAGE_QUALITY: 0.7,
      IMAGE_MAX_WIDTH: 1200,
      DRAFT_KEY: 'safety_form_draft'
    };

    const UNIFIED_AREAS = [
      { value: "PRINT", label: "🖨️ PRINT", has5S: true, hasSafety: true },
      { value: "LAMINATE", label: "📦 LAMINATE", has5S: true, hasSafety: true },

    // 📋 SAFETY CHECKLISTS (ตรงกับหลังบ้าน v3.6)
    // =====================================================================

      s2: { title: "2. ท่าทางการทำงาน", qs: ["พนักงานทำงานในท่าทางที่ถูกต้อง", "การใช้รถเข็น, แฮนด์ลิฟท์, หรืออุปกรณ์ที่มีล้อในการเคลื่อนย้ายสิ่งของ", "การยกของอย่างถูกต้องและปลอดภัย"] },

      s4: { title: "4. สารเคมี", qs: ["การสวมใส่อุปกรณ์ป้องกันอันตรายขณะปฏิบัติงานตามที่กำหนด", "ไม่มีสารเคมีหกรั่วไหล, ไม่มีกลิ่นสารเคมีฟุ้งกระจายในอากาศ", "ภาชนะปิดสนิท, สภาพถังใส่สารเคมีแข็งแรงปลอดภัยและสะอาด, อุปกรณ์ใช้งานกับสารเคมีเช่น Valv/Flange/Pipe อยู่ในสภาพไม่ชำรุด รั่วซึม", "อากาศถ่ายเท", "มีอุปกรณ์ Spill Kit พร้อมใช้งาน", "มีขั้นตอนการปฏิบัติงาน", "บันทึกการตรวจสายกราวด์", "มีฉลากระบุสารเคมี และมี SDS"] },
      s5: { title: "5. ไฟฟ้า", qs: ["ตรวจสอบอุปกรณ์ไฟฟ้าเช่น สายไฟ ปลั๊กไฟ ต้องไม่ชำรุดเสียหาย", "ปล๊กไฟ/เต้าเสียบไม่หลวม", "ไม่มีการต่ออุปกรณ์พวงไฟฟ้าแบบชั่วคราว", "อุปกรณ์ไฟฟ้าต้องมีการต่อสายดิน", "ตู้ควบคุมไฟฟ้าปิดเรียบร้อย, ไม่มีสายไฟโผล่, ไม่มีสิ่งกีดขวางหน้าตู้", "ไม่มีสิ่งของต่างๆหรือฝุ่นละอองสะสมอยู่บนแผงควบคุมไฟฟ้า, ไม่มีกระดาษ,พลาสติกหรืออุปกรณ์ติดไฟง่าย อยู่ในตู้ไฟและติดหน้าตู้ไฟ"] },

      s7: { title: "7. การกำจัดของเสีย", qs: ["มีการแยกประเภทขยะ, การปิดฝาถังขยะ, ถังขยะไม่มีชำรุด แตกหัก"] },
      s8: { title: "8. Other", qs: ["ระบุรายการที่ 1 (พิมพ์รายละเอียดในหมายเหตุ)", "ระบุรายการที่ 2 (พิมพ์รายละเอียดในหมายเหตุ)", "ระบุรายการที่ 3 (พิมพ์รายละเอียดในหมายเหตุ)"] }
    };

    const SAFETY_CHECKLIST_OFFICE = {
      s1: { title: "1. สภาพแวดล้อมสำนักงาน", qs: ["พื้นที่ทำงานสะอาด เป็นระเบียบ ไม่มีสิ่งของวางเกะกะ", "แสงสว่างเพียงพอต่อการทำงาน", "ระบบปรับอากาศ/อากาศถ่ายเทสะดวก", "เฟอร์นิเจอร์อยู่ในสภาพปลอดภัยมั่นคง", "ไม่มีการจัดวางของหนักบนที่สูงเกินระดับปลอดภัย"] },
      s2: { title: "2. ท่านั่งทำงานและ Ergonomics", qs: ["ท่านั่งทำงานถูกต้อง จอคอมพิวเตอร์ระดับสายตา", "มีการพักสายตา/ยืดเหยียดร่างกายตามความเหมาะสม", "การหยิบเอกสารไม่มีการบิดเอี้ยวหรือก้มเงยมากเกินไป"] },
      s3: { title: "3. ระบบไฟฟ้าและอุปกรณ์ IT", qs: ["สายไฟคอมพิวเตอร์ไม่พันกันหรือวางพาดทางเดิน", "ปลั๊กพ่วงไม่รับโหลดเกินกำหนด และอยู่ในสภาพสมบูรณ์", "อุปกรณ์ไฟฟ้าปิดสวิตช์เมื่อเลิกใช้งาน", "ไม่มีการดัดแปลงสายไฟหรือใช้เทปพันสายไฟที่ชำรุด"] },
      s4: { title: "4. สารเคมีสำนักงาน", qs: ["น้ำยาทำความสะอาด/หมึกพิมพ์ เก็บในที่มิดชิดและมีฉลาก", "ไม่มีภาชนะเปิดทิ้งไว้หรือวางใกล้แหล่งความร้อน", "มีการใช้ถุงมือ/หน้ากากเมื่อสัมผัสสารทำความสะอาด"] },

      s6: { title: "6. การกำจัดขยะ", qs: ["มีการแยกขยะ (ทั่วไป/รีไซเคิล/อันตราย) ถูกต้อง", "ถังขยะมีฝาปิดมิดชิด และอยู่ในสภาพไม่ชำรุด", "ไม่มีการทิ้งขยะเกลื่อนกลาดหรือวางกองไว้เกินกำหนด"] },
      s7: { title: "7. Other (ไม่บังคับ)", qs: ["ระบุรายการที่ 1 (พิมพ์รายละเอียดในหมายเหตุ)", "ระบุรายการที่ 2 (พิมพ์รายละเอียดในหมายเหตุ)", "ระบุรายการที่ 3 (พิมพ์รายละเอียดในหมายเหตุ)"] }
    };

    const SAFETY_CHECKLIST_WAREHOUSE = {
      s1: { title: "1. สถานที่ทำงาน", qs: ["วางสิ่งของในเส้นที่กำหนด", "สถานที่ทำงานมีแสงสว่างเพียงพอ", "สถานที่ทำงาน อากาศ ถ่ายเทสะดวก", "การดูแลและทำความสะอาดของพื้นที่", "ไม่วางสินค้า หรือพาเลทเกินมาตรฐานที่กำหนด"] },

    function getSafetyChecklist(area) {
      const normalized = String(area || "").trim().toUpperCase();
      const key = SAFETY_CHECKLIST_MAP[normalized] || SAFETY_CHECKLIST_MAP["DEFAULT"];
      if (key === "OFFICE") return SAFETY_CHECKLIST_OFFICE;
      if (key === "OUTSIDE") return SAFETY_CHECKLIST_OUTSIDE;
      if (key === "WAREHOUSE") return SAFETY_CHECKLIST_WAREHOUSE;
      return SAFETY_CHECKLIST_FACTORY;
    }

    let state = { type: 'จป.ว', area: 'PRINT', area5S: 'PRINT', responses: {}, images: {} };

    function init() { populateDropdowns(); buildChecklist(); loadDraft(); setupAutoSave(); document.getElementById('safetyForm').addEventListener('submit', handleSubmit); }

    function populateDropdowns() {
      const fillSelect = (id, filterBy, defaultVal) => {
        const sel = document.getElementById(id);
        sel.innerHTML = UNIFIED_AREAS.filter(a => !filterBy || a[filterBy]).map(a => `<option value="${a.value}" ${a.value===defaultVal?'selected':''}>${a.label}</option>`).join('');
      };
      fillSelect('areaSafetySelect', 'hasSafety', state.area);
      fillSelect('area5SSelect', 'has5S', state.area5S);
    }

    function handleAreaChange(val) { state.area = val; document.getElementById('areaSafetyVal').value = val; buildChecklist(); }
    function handle5SAreaChange(val) { 
      state.area5S = val;
      document.getElementById('area5SVal').value = val; 
      buildChecklist();
    }

    function selectType(type, el) {
      state.type = type; 
      document.getElementById('inspectionType').value = type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active', 'active-5s'));
      el.classList.add(type === '5S' ? 'active-5s' : 'active');
      
      const is5S = type === '5S';
      document.getElementById('areaSafety').style.display = is5S ? 'none' : 'block';
      document.getElementById('area5S').style.display = is5S ? 'block' : 'none';
      
      if (is5S) {
        state.area5S = document.getElementById('area5SSelect').value;
      } else {
        state.area = document.getElementById('areaSafetySelect').value;
      }
      
      document.getElementById('headerTitle').textContent = is5S ? 'การตรวจ 5ส' : 'SAFETY PATROL';
      document.getElementById('headerSub').textContent = is5S ? 'กิจกรรม 5 ส' : 'ระบบตรวจสอบความปลอดภัย';
      buildChecklist();
    }

    function buildChecklist() {
      const container = document.getElementById('checklistContainer'); 
      container.innerHTML = ''; 
      state.responses = {}; 
      state.images = {};
      if (state.type === '5S') render5SChecklist(container); 
      else renderSafetyChecklist(container);
    }

    function renderSafetyChecklist(container) {
      const checklist = getSafetyChecklist(state.area);
      Object.entries(checklist).forEach(([sKey, section]) => {
        const sNum = sKey.replace('s', ''); 
        const card = document.createElement('div'); 
        card.className = 'bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3';
        let html = `<div class="inline-block bg-[#003566] text-white px-3 py-1 rounded-full text-[11px] font-bold">Safety</div><h3 class="font-bold text-slate-800 text-sm md:text-base border-l-4 border-[#003566] pl-2">${section.title}</h3>`;
        section.qs.forEach((q, i) => {
          const qKey = `s${sNum}_q${i}`; 
          const isOptional = sKey === 's7' || sKey === 's8';
          const isWater = sKey === 's1' && q === 'Water Mist'; 
          const showWater = (state.area === 'PRINT' || state.area === 'LAMINATE') && isWater;
          if (showWater) {
            html += `<div class="p-4 bg-slate-50 border border-slate-200 rounded-xl" id="item_${qKey}"><small class="text-xs md:text-sm font-semibold block mb-2">${i+1}. ${q}</small>
              <div class="flex items-center gap-2 mb-2 flex-wrap">

    function photoUploadHTML(qKey) {
      return `<div class="mt-2 border border-dashed border-slate-300 bg-white p-3 rounded-xl"><div id="preview_${qKey}" class="flex flex-wrap gap-2 mb-2"></div><div class="grid grid-cols-2 gap-2">
        <button type="button" class="flex items-center justify-center gap-1 p-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-600 bg-slate-50 hover:bg-slate-100 transition" onclick="triggerInput('cam','${qKey}')"><i class="fas fa-camera"></i> ถ่ายรูป</button>
        <button type="button" class="flex items-center justify-center gap-1 p-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-600 bg-slate-50 hover:bg-slate-100 transition" onclick="triggerInput('gal','${qKey}')"><i class="fas fa-images"></i> อัลบั้ม</button></div>
        <input type="file" id="cam_${qKey}" accept="image/*" capture="environment" class="hidden" onchange="handlePhoto(this,'${qKey}')">
        <input type="file" id="gal_${qKey}" accept="image/*" class="hidden" onchange="handlePhoto(this,'${qKey}')"></div>`;
    }

    function triggerInput(type, qKey) { document.getElementById(`${type}_${qKey}`).click(); }
    
    function handlePhoto(input, qKey) {
      if (!input.files[0]) return; 
      if (!state.images[qKey]) state.images[qKey] = [];
      if (state.images[qKey].length >= CONFIG.MAX_IMAGES_PER_ITEM) { 
        showToast('จำกัดสูงสุด 3 รูปต่อข้อ', 'error'); 
        input.value = ''; 
        return; 
      }
      const reader = new FileReader(); 
      reader.onload = e => {
        const img = new Image(); 
        img.onload = () => {
          const canvas = document.createElement('canvas'); 
          const scale = Math.min(CONFIG.IMAGE_MAX_WIDTH / img.width, CONFIG.IMAGE_MAX_WIDTH / img.height, 1);
          canvas.width = img.width * scale; 
          canvas.height = img.height * scale; 
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          state.images[qKey].push({ b64: canvas.toDataURL('image/jpeg', CONFIG.IMAGE_QUALITY), caption: '' }); 
          renderPhotos(qKey); 
          input.value = '';
        }; 
        img.src = e.target.result; 
      }; 
      reader.readAsDataURL(input.files[0]);
    }

    function renderPhotos(qKey) {
      const container = document.getElementById(`preview_${qKey}`); 
      container.innerHTML = (state.images[qKey] || []).map((img, idx) => `
        <div class="relative w-16 h-16 rounded-lg border overflow-hidden bg-slate-100">
          <img src="${img.b64}" class="w-full h-full object-cover">
          <div class="absolute -top-1 -right-1 w-5 h-5 bg-rose-500 text-white rounded-full flex items-center justify-center cursor-pointer border text-[10px]" onclick="removePhoto('${qKey}', ${idx})"><i class="fas fa-times"></i></div>
        </div>
        <input class="w-full border p-1 text-[11px] rounded bg-white" value="${escapeHtml(img.caption)}" placeholder="คำอธิบายรูปภาพ.." onchange="updateCaption('${qKey}', ${idx}, this.value)">
      `).join('');
    }

    function removePhoto(qKey, idx) { state.images[qKey].splice(idx, 1); renderPhotos(qKey); }
    function updateCaption(qKey, idx, val) { if (state.images[qKey][idx]) state.images[qKey][idx].caption = val; }

    function handleStatusChange(qKey, status) {
      const el = document.getElementById(`item_${qKey}`), remark = el.querySelector('textarea'), ddBox = document.getElementById(`dd_${qKey}`), ddInput = ddBox.querySelector('input');
      state.responses[qKey] = { status };
      if (status === 'ไม่ดี') { 
        el.classList.add('needs-attention'); 
        remark.required = true; 
        remark.placeholder = '* กรุณาระบุรายละเอียดปัญหา'; 
        ddBox.style.display = 'block'; 
        ddInput.required = true; 
      } else { 
        el.classList.remove('needs-attention'); 
        remark.required = false; 
        remark.placeholder = 'หมายเหตุ (ถ้ามี)'; 
        ddBox.style.display = 'none'; 
        ddInput.required = false; 
        ddInput.value = ''; 
      }
      syncRadioStyles();
    }

    function handleWaterMist(val, sNum, i) {
      const qKey = `s${sNum}_q${i}`, badge = document.getElementById(`water_badge_${sNum}_${i}`), el = document.getElementById(`item_${qKey}`), remark = el.querySelector('textarea'), ddBox = document.getElementById(`dd_${qKey}`), ddInput = ddBox?.querySelector('input'), hidden = document.getElementById(`hidden_${qKey}`);
      if (!val) { 
        badge.style.display='none'; 
        hidden.value=''; 
        state.responses[qKey] = {}; 
        return; 
      }
      const num = parseFloat(val); 
      badge.style.display = 'inline-block';
      if (num < 50) { 
        badge.textContent = '⚠️ ไม่ปกติ'; 
        badge.className = 'text-xs font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700'; 
        hidden.value = 'ไม่ดี'; 
        state.responses[qKey] = { status: 'ไม่ดี', waterValue: num }; 
        remark.required = true; 
        ddBox.style.display = 'block'; 
        ddInput.required = true; 
      } else { 
        badge.textContent = '✅ ปกติ'; 
        badge.className = 'text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700'; 
        hidden.value = 'ดี'; 
        state.responses[qKey] = { status: 'ดี', waterValue: num }; 
        remark.required = false; 
        ddBox.style.display = 'none'; 
        ddInput.required = false; 
        ddInput.value = ''; 
      }
    }

    function syncRadioStyles() {
      document.querySelectorAll('input[type="radio"]').forEach(radio => {
        const label = radio.nextElementSibling; 
        if(!label) return;
        if (radio.checked) {
          if (radio.value === 'ดี') label.className = "flex items-center justify-center gap-1 p-2 border-2 border-emerald-500 bg-emerald-50 rounded-lg text-xs md:text-sm font-semibold text-emerald-700";
          else if (radio.value === 'ไม่ดี') label.className = "flex items-center justify-center gap-1 p-2 border-2 border-rose-500 bg-rose-50 rounded-lg text-xs md:text-sm font-semibold text-rose-700";
          else if (radio.value === 'พอใช้') label.className = "flex flex-col items-center justify-center p-2 border-2 border-amber-500 bg-amber-50 rounded-lg text-[11px] font-semibold text-amber-700 min-h-[50px]";
          else if (radio.value === 'ปรับปรุง') label.className = "flex flex-col items-center justify-center p-2 border-2 border-rose-500 bg-rose-50 rounded-lg text-[11px] font-semibold text-rose-700 min-h-[50px]";
        } else {
          if (radio.value === 'ดี' || radio.value === 'ไม่ดี') label.className = "flex items-center justify-center gap-1 p-2 border border-slate-300 rounded-lg bg-white cursor-pointer text-xs md:text-sm font-medium text-slate-600 hover:bg-slate-50 transition";
          else label.className = "flex flex-col items-center justify-center p-2 border border-slate-300 rounded-lg bg-white cursor-pointer text-[11px] font-medium text-slate-600 hover:bg-slate-50 transition min-h-[50px]";
        }
      });
    }

    function validate() {
      if (!document.getElementById('inspectorName').value.trim()) { 
        showToast('กรุณาระบุชื่อผู้ตรวจสอบ', 'error'); 
        return false; 
      }
      document.querySelectorAll('.p-4').forEach(el => el.classList.remove('error')); 
      let valid = true;
      document.querySelectorAll('.p-4').forEach(el => {
        if (el.style.display === 'none') return; 
        const qKey = el.id.replace('item_', '');
        if (state.type === '5S') {
          const radios = el.querySelectorAll('input[type="radio"]');
          if (radios.length > 0) { 
            const checked = el.querySelector('input[type="radio"]:checked');
            if (!checked) { 
              el.classList.add('error'); 
              valid = false; 
            } else if (checked.value === 'ปรับปรุง') { 
              const remark = el.querySelector('textarea'), dueDate = el.querySelector('input[type="date"]'); 
              if (!remark.value.trim() || !dueDate.value) { 
                el.classList.add('error'); 
                valid = false; 
              } 
            } 
          }
        } else {
          const radios = el.querySelectorAll('input[type="radio"]');
          if (radios.length > 0) { 
            const checked = el.querySelector('input[type="radio"]:checked');
            if (!checked && !el.classList.contains('water-mist-block')) { 
              el.classList.add('error'); 
              valid = false; 
            } else if (checked?.value === 'ไม่ดี') { 
              if (!el.querySelector('textarea').value.trim() || !el.querySelector('input[type="date"]').value) { 
                el.classList.add('error'); 
                valid = false; 
              } 
            } 
          }
          if (el.id.includes('s1_q5') && el.style.display !== 'none') {
            const wv = el.querySelector('input[type="number"]'); 
            if (wv && !wv.value.trim()) { 
              el.classList.add('error'); 
              valid = false; 
            } else if (wv && parseFloat(wv.value) < 50) { 
              if (!el.querySelector('textarea').value.trim() || !el.querySelector('input[type="date"]').value) { 
                el.classList.add('error'); 
                valid = false; 
              } 
            } 
          }
        }
      }); 
      if (!valid) { 
        const firstErr = document.querySelector('.error'); 
        if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
      } 
      return valid;
    }

    async function handleSubmit(e) { 
      e.preventDefault(); 
      if (!validate()) return; 
      document.getElementById('loader').classList.add('flex'); 
      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('submitBtn').disabled = true;
      try { 
        const res = await fetchWithRetry(CONFIG.API_URL, { 
          method: 'POST', 
          headers: { 'Content-Type': 'text/plain' }, 
          body: JSON.stringify(buildPayload()) 
        });
        if (res.status === 'success') { 
          showToast('✅ ส่งรายงานสำเร็จ', 'success'); 
          localStorage.removeItem(CONFIG.DRAFT_KEY); 
          setTimeout(() => window.location.href = 'DashNew.html', 1500); 
        } else {
          throw new Error(res.message || 'Submission failed'); 
        }
      } catch (err) { 
        showToast(`❌ ${err.message}`, 'error'); 
      } finally { 
        document.getElementById('loader').classList.remove('flex'); 
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('submitBtn').disabled = false; 
      }
    }

    function buildPayload() {
      const details = {}, images = {}, is5S = state.type === '5S', area = is5S ? state.area5S : state.area;
      
      Object.entries(state.responses).forEach(([qKey, resp]) => {
        if (!resp.status) return;
        
        // ✅ สร้าง key ให้ตรงกับหลังบ้าน
        let detailKey;
        if (is5S) {
          detailKey = qKey; // 5s_s0_q0
        } else {
          detailKey = `section${qKey.replace('s', '')}`; // section1_q0
        }
        
        details[detailKey] = resp.status;
        
        if ((is5S && resp.status === 'ปรับปรุง') || (!is5S && resp.status === 'ไม่ดี')) {
          // ✅ ใช้ key ตรงกับหลังบ้าน: ${detailKey}_remark
          details[`${detailKey}_remark`] = document.querySelector(`#item_${qKey} textarea`)?.value || '';
          details[`${detailKey}_duedate`] = document.querySelector(`#item_${qKey} input[type="date"]`)?.value || '';
        }
        
        if (resp.waterValue !== undefined) details.water_val = resp.waterValue;
      });
      
      // ✅ จัดการรูปภาพ - ใช้ key ที่หลังบ้านคาดหวัง
      Object.entries(state.images).forEach(([qKey, imgs]) => {
        imgs.forEach((img, idx) => {
          let backendKey = qKey;
          if (qKey.startsWith('5s_s')) { 
            const match = qKey.match(/5s_s(\d+)_q(\d+)/); 
            if (match) backendKey = `5s_${match[1]}_${match[2]}`; 
          } else if (qKey.startsWith('s')) {
            // Safety: s1_q0 -> s1_q0 (そのまま)
            backendKey = qKey;
          }
          images[`${backendKey}_${idx}`] = img.b64;
          if (img.caption?.trim()) details[`caption_${backendKey}_${idx}`] = img.caption;
        });
      });
      
      const secRes = {};
      if (is5S) {
        const sections = (CHECKLIST_5S[state.area5S] || CHECKLIST_5S["OFFICE"])?.sections || [];
        sections.forEach((_, sIdx) => { secRes[`s${sIdx+1}_res`] = 'ดี'; });
      } else {
        const checklist = getSafetyChecklist(area);
        Object.keys(checklist).forEach(sKey => {
          const sNum = sKey.replace('s', ''); 
          let hasBad = false;
          checklist[sKey].qs.forEach((_, qIdx) => { 
            if (details[`section${sNum}_q${qIdx}`] === 'ไม่ดี') hasBad = true; 
          });
          if (sKey === 's1' && (area === 'PRINT' || area === 'LAMINATE')) { 
            const wv = parseFloat(details.water_val); 
            if (!isNaN(wv) && wv < 50) hasBad = true; 
          }
          secRes[`${sKey}_res`] = hasBad ? 'ไม่ดี' : 'ดี';
        });
      }
      
      return { 
        inspector: document.getElementById('inspectorName').value.trim(), 
        area, 
        inspectionType: state.type, 
        area5S: is5S ? area : null, 
        images, 
        details, 
        ...secRes 
      };
    }

    async function fetchWithRetry(url, options, retries = 3) { 
      for (let i=0; i<retries; i++) { 
        try { 
          const res = await fetch(url, options); 
          return await res.json(); 
        } catch(e) { 
          if(i===retries-1) throw e; 
          await new Promise(r=>setTimeout(r, 1000*(i+1))); 
        } 
      } 
    }

    function setupAutoSave() { 
      setInterval(() => { 
        localStorage.setItem(CONFIG.DRAFT_KEY, JSON.stringify({ 
          type: state.type, 
          area: state.area, 
          area5S: state.area5S, 
          inspector: document.getElementById('inspectorName').value, 
          timestamp: Date.now() 
        })); 
      }, 30000); 
    }
    
    function loadDraft() { 
      const raw = localStorage.getItem(CONFIG.DRAFT_KEY); 
      if (!raw) return; 
      try { 
        const d = JSON.parse(raw); 
        if (Date.now() - d.timestamp < 86400000) { 
          document.getElementById('inspectorName').value = d.inspector || ''; 
          if (d.type) selectType(d.type, document.querySelector(`.type-btn[data-type="${d.type}"]`)); 
          state.area = d.area || 'PRINT'; 
          state.area5S = d.area5S || 'PRINT'; 
          populateDropdowns(); 
          buildChecklist(); 
          showToast('📥 โหลดข้อมูลล่าสุดจากเครื่อง', 'success'); 
        } 
      } catch(e) { console.warn('Draft load error:', e); }
    }
    
    function escapeHtml(t) { 
      return t ? t.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) : ''; 
    }
    
    function showToast(msg, type='info') {
      const t = document.createElement('div');
      t.className = `fixed bottom-5 right-5 p-4 rounded-xl shadow-lg bg-white z-[9999] flex items-center gap-2 border-l-4 border-sky-600 text-sm font-medium transition duration-300`;
      if(type==='success') t.classList.add('border-emerald-500'); 
      else if(type==='error') t.classList.add('border-rose-500');
      t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle text-emerald-500':type==='error'?'exclamation-circle text-rose-500':'info-circle text-sky-600'}"></i><span>${msg}</span>`;
      document.body.appendChild(t); 
      setTimeout(() => { 
        t.style.opacity = '0'; 
        setTimeout(()=>t.remove(), 300); 
      }, 3000);
    }
    
    init();
  </script>
  <script>
    // โค้ดดักจับว่าเปิดผ่านเบราว์เซอร์ของ LINE หรือไม่
    window.addEventListener('load', function() {
      if (navigator.userAgent.indexOf("Line") > -1) {
        const lineAlert = document.createElement('div');
        lineAlert.style.cssText = "position:fixed; top:0; left:0; width:100%; background:#ef4444; color:white; padding:15px; text-align:center; z-index:99999; font-family:'Prompt', sans-serif; font-size:14px; font-weight:600; box-shadow:0 4px 6px rgba(0,0,0,0.1);";
        lineAlert.innerHTML = `
          <div style="font-size:16px; margin-bottom:5px;"><i class="fas fa-exclamation-triangle"></i> คุณกำลังเปิดผ่านแอป LINE</div>
          เพื่อป้องกันปัญหากล้องค้างหรือไม่บันทึกภาพ<br>
          กรุณากดไอคอน <b style="background:rgba(0,0,0,0.2); padding:2px 6px; border-radius:4px;">[ จุด 3 จุด ]</b> หรือ <b style="background:rgba(0,0,0,0.2); padding:2px 6px; border-radius:4px;">[ แชร์ ]</b> มุมขวาบน<br>
          แล้วเลือก <b>"เปิดในเบราว์เซอร์เริ่มต้น"</b> (Open in Browser)
          <div style="margin-top:10px;">
            <button onclick="this.parentElement.parentElement.remove()" style="background:white; color:#ef4444; padding:5px 15px; border-radius:6px; border:none; font-weight:bold;">เข้าใจแล้ว ปิดหน้าต่างนี้</button>
          </div>
        `;
        document.body.appendChild(lineAlert);
      }
    });
  </script>
</body>
</html>
